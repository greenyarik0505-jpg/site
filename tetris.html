<style>

<body>
<a class="portal-home-btn" href="index.html">Главное меню</a>
<main class="wrap">
  <div class="hud"><div class="title">Тетрис</div><div class="score">Счет: <span id="score">0</span> · Уровень: <span id="level">1</span></div></div>
  <canvas id="game" width="240" height="360"></canvas>
  <button class="start" id="start">Старт / заново</button>
  <div class="buttons">
    <button data-act="left">◀</button><button data-act="rotate">⟳</button><button data-act="right">▶</button><button data-act="down">▼</button><button data-act="drop">⤓</button>
  </div>
  <div class="note">Стрелки: движение, вверх: поворот, пробел: вниз до конца. Скорость растет с уровнем.</div>
</main>
<script>
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level');
const COLS=10,ROWS=20,B=18,OX=30,OY=0,colors=['','#67e8f9','#facc15','#a78bfa','#fb7185','#34d399','#60a5fa','#f97316'];
const shapes=[[[1,1,1,1]],[[2,2],[2,2]],[[0,3,0],[3,3,3]],[[4,4,0],[0,4,4]],[[0,5,5],[5,5,0]],[[6,0,0],[6,6,6]],[[0,0,7],[7,7,7]]];
let board,piece,score,level,timer,delay;
function reset(){board=Array.from({length:ROWS},()=>Array(COLS).fill(0));score=0;level=1;delay=650;spawn();loop();}
function spawn(){const id=Math.floor(Math.random()*shapes.length)+1;piece={m:shapes[id-1].map(r=>r.slice()),x:3,y:0,id};if(hit(piece.x,piece.y,piece.m)){clearTimeout(timer);draw('Игра окончена');}}
function hit(x,y,m){return m.some((r,dy)=>r.some((v,dx)=>v&&(x+dx<0||x+dx>=COLS||y+dy>=ROWS||(y+dy>=0&&board[y+dy][x+dx]))));}
function merge(){piece.m.forEach((r,dy)=>r.forEach((v,dx)=>{if(v&&piece.y+dy>=0)board[piece.y+dy][piece.x+dx]=piece.id;}));let lines=0;for(let y=ROWS-1;y>=0;y--){if(board[y].every(Boolean)){board.splice(y,1);board.unshift(Array(COLS).fill(0));lines++;y++;}}if(lines){score+=lines*100*level;level=1+Math.floor(score/600);delay=Math.max(120,650-(level-1)*55);scoreEl.textContent=score;levelEl.textContent=level;}spawn();}
function move(dx,dy){if(!hit(piece.x+dx,piece.y+dy,piece.m)){piece.x+=dx;piece.y+=dy;draw();return true}return false}
function rotate(){const m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());if(!hit(piece.x,piece.y,m)){piece.m=m;draw();}}
function tick(){if(!move(0,1))merge();loop();}
function loop(){clearTimeout(timer);timer=setTimeout(tick,delay);}
function drop(){while(move(0,1));merge();loop();}
function draw(msg){ctx.fillStyle='#070816';ctx.fillRect(0,0,cvs.width,cvs.height);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)cell(x,y,board[y][x]);piece.m.forEach((r,dy)=>r.forEach((v,dx)=>{if(v)cell(piece.x+dx,piece.y+dy,piece.id)}));if(msg){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,140,240,80);ctx.fillStyle='#fff';ctx.font='700 22px Arial';ctx.textAlign='center';ctx.fillText(msg,120,188);}}
function cell(x,y,id){if(y<0)return;ctx.fillStyle=id?colors[id]:'rgba(255,255,255,.035)';ctx.fillRect(OX+x*B+1,OY+y*B+1,B-2,B-2);if(id){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.strokeRect(OX+x*B+2,OY+y*B+2,B-4,B-4);}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowUp')rotate();if(e.code==='Space')drop();});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>({left:()=>move(-1,0),right:()=>move(1,0),down:()=>move(0,1),rotate,drop}[b.dataset.act]()));
document.getElementById('start').onclick=reset;reset();
</script>

    document.getElementById('troll-matrix').style.display='none';clearInterval(_matrixInterval);
    document.getElementById('troll-virus').style.display='none';
    document.getElementById('troll-disco').style.display='none';clearTimeout(_discoTimeout);
    document.getElementById('troll-rainbow-overlay').style.display='none';
    document.getElementById('troll-glitch').style.display='none';document.getElementById('troll-glitch').innerHTML='';clearInterval(_glitchInterval);
    document.getElementById('troll-typewriter').style.display='none';clearInterval(_typewriterInterval);
    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();var map={'new_game':'bubblepop','flappy_bird':'flappy','tic_tac_toe':'tictactoe','pixel_art':'pixelart','cafe_sim':'cafesim'};var raw=(location.pathname.split('/').pop()||'index.html').toLowerCase().replace(/\.html$/,'');var gid=map[raw]||raw;if(data&&data.time>lastTrollTime&&(!data.target||data.target==='all'||data.target===gid)){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
