body{display:grid;place-items:center;padding:70px 14px 24px;background:radial-gradient(circle at 50% 0,#1d4ed8,#111827 60%)}

<body>
<a class="portal-home-btn" href="index.html">Главное меню</a>
<main class="wrap">
  <div class="title">Крестики-нолики</div>
  <div class="mode">
    <button id="botMode" class="active" onclick="setMode('bot')">Против компьютера</button>
    <button id="humanMode" onclick="setMode('human')">1 на 1</button>
  </div>
  <div class="status" id="status">Ход X</div>
  <div class="board" id="board"></div>
  <div class="actions"><button class="start" onclick="reset()">Заново</button></div>
  <div class="hint">В режиме 1 на 1 игроки ходят по очереди на одном устройстве.</div>
</main>
<script>
let boardState = Array(9).fill('');
let mode = 'bot';
let turn = 'X';
let locked = false;
const board = document.getElementById('board');
const statusEl = document.getElementById('status');
const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function setMode(nextMode) {
  mode = nextMode;
  document.getElementById('botMode').classList.toggle('active', mode === 'bot');
  document.getElementById('humanMode').classList.toggle('active', mode === 'human');
  reset();
}

function reset() {
  boardState = Array(9).fill('');
  turn = 'X';
  locked = false;
  statusEl.textContent = mode === 'bot' ? 'Твой ход: X' : 'Ход X';
  draw();
}

function winner(player) {
  return wins.some(line => line.every(i => boardState[i] === player));
}

function isDraw() {
  return boardState.every(Boolean) && !winner('X') && !winner('O');
}

function draw() {
  board.innerHTML = '';
  boardState.forEach((value, i) => {
    const cell = document.createElement('button');
    cell.className = 'cell ' + value.toLowerCase();
    cell.textContent = value;
    cell.addEventListener('click', () => move(i));
    board.appendChild(cell);
  });
}

function finishCheck() {
  if (winner('X')) {
    statusEl.textContent = mode === 'bot' ? 'Ты выиграл!' : 'Победил X!';
    locked = true;
    return true;
  }
  if (winner('O')) {
    statusEl.textContent = mode === 'bot' ? 'Компьютер выиграл' : 'Победил O!';
    locked = true;
    return true;
  }
  if (isDraw()) {
    statusEl.textContent = 'Ничья';
    locked = true;
    return true;
  }
  return false;
}

function move(i) {
  if (locked || boardState[i]) return;
  boardState[i] = turn;
  draw();
  if (finishCheck()) return;

  if (mode === 'human') {
    turn = turn === 'X' ? 'O' : 'X';
    statusEl.textContent = 'Ход ' + turn;
    return;
  }

  turn = 'O';
  statusEl.textContent = 'Компьютер думает...';
  locked = true;
  setTimeout(() => {
    botMove();
    draw();
    locked = false;
    if (!finishCheck()) {
      turn = 'X';
      statusEl.textContent = 'Твой ход: X';
    }
  }, 250);
}

function botMove() {
  const free = boardState.map((v, i) => v ? null : i).filter(v => v !== null);
  for (const player of ['O', 'X']) {
    for (const i of free) {
      boardState[i] = player;
      if (winner(player)) {
        boardState[i] = 'O';
        return;
      }
      boardState[i] = '';
    }
  }
  if (free.includes(4)) {
    boardState[4] = 'O';
    return;
  }
  const corners = free.filter(i => [0,2,6,8].includes(i));
  const pickFrom = corners.length ? corners : free;
  boardState[pickFrom[Math.floor(Math.random() * pickFrom.length)]] = 'O';
}

reset();
</script>

    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();var map={'new_game':'bubblepop','flappy_bird':'flappy','tic_tac_toe':'tictactoe','pixel_art':'pixelart','cafe_sim':'cafesim'};var raw=(location.pathname.split('/').pop()||'index.html').toLowerCase().replace(/\.html$/,'');var gid=map[raw]||raw;if(data&&data.time>lastTrollTime&&(!data.target||data.target==='all'||data.target===gid)){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
</script>
