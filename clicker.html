.portal-home-btn{position:fixed;top:12px;left:12px;z-index:10050;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.58);color:#fff;padding:9px 14px;border-radius:12px;font:800 13px Arial,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.app{width:min(1050px,100%);margin:0 auto;display:grid;grid-template-columns:1fr 330px;gap:14px}.panel{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);border-radius:8px;padding:14px;box-shadow:0 18px 55px rgba(0,0,0,.25);backdrop-filter:blur(12px)}
h1{font-size:clamp(32px,7vw,66px);margin:0;color:#facc15;text-shadow:0 0 22px rgba(250,204,21,.45);line-height:1}.sub{color:#d6e4ff;font-weight:800;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.stat{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px}.stat b{display:block;color:#facc15;font-size:22px}.stat span{font-size:11px;color:#b9c7de;font-weight:900;text-transform:uppercase}
.coin-wrap{display:grid;place-items:center;padding:16px}.coin{width:min(52vmin,260px);aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff5aa,#facc15 43%,#a16207);font-size:76px;box-shadow:0 18px 0 #713f12,0 32px 70px rgba(0,0,0,.55);transition:transform .07s}.coin:active{transform:translateY(10px) scale(.98);box-shadow:0 8px 0 #713f12}.bar{height:12px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15);border-radius:inherit}

<body>
<a class="portal-home-btn" href="index.html">Главное меню</a>
<main class="app">
  <section class="panel">
    <h1>Кликер Империя</h1>
    <div class="sub">Кликай, строй бизнесы, закрывай миссии, уходи в престиж и соревнуйся в лидерборде.</div>
    <div class="stats">
      <div class="stat"><span>Монеты</span><b id="money">0</b></div>
      <div class="stat"><span>За клик</span><b id="power">1</b></div>
      <div class="stat"><span>В секунду</span><b id="perSec">0</b></div>
      <div class="stat"><span>Уровень</span><b id="level">1</b></div>
    </div>
    <div class="coin-wrap"><button class="coin" onclick="clickCoin()">💰</button></div>
    <div class="bar"><i id="xpBar" style="width:0%"></i></div>
  </section>
  <aside class="side">
    <section class="panel">
      <div class="tabs"><button id="tabUp" class="active" onclick="setTab('up')">Бизнес</button><button id="tabMis" onclick="setTab('mis')">Миссии</button><button id="tabMarket" onclick="setTab('market')">Рынок</button></div>
      <div id="upgrades" class="grid"></div>
      <div id="missions" class="grid" style="display:none"></div>
      <div id="market" class="grid" style="display:none"></div>
    </section>
    <section class="panel">
      <div class="row"><button class="sidebtn" onclick="prestige()">Престиж</button><button class="sidebtn" onclick="dailyBonus()">Бонус</button></div>
      <div class="log" id="log">Империя готова к росту.</div>
    </section>
  </aside>
</main>
<script>
const SAVE='clicker_empire_v2';
const now=Date.now();
let state=JSON.parse(localStorage.getItem(SAVE)||'null')||{money:0,total:0,power:1,xp:0,level:1,prestige:0,last:now,lastBonus:0,market:1,up:{auto:0,shop:0,factory:0,bank:0,lab:0},cost:{power:20,auto:75,shop:260,factory:900,bank:3500,lab:12000},done:{}};
const defs={power:['Сила клика','+1 за клик'],auto:['Автокликер','+1/сек'],shop:['Магазин','+7/сек'],factory:['Фабрика','+30/сек'],bank:['Банк','+120/сек'],lab:['Лаборатория','+500/сек']};
const income={auto:1,shop:7,factory:30,bank:120,lab:500};
const missions=[['first100','Первые 100',100,40],['rich1k','Накопи 1 000',1000,180],['boss10k','Империя 10 000',10000,1200],['mega100k','Магнат 100 000',100000,9000]];
function mult(){return 1+state.prestige*.25}
function perSecond(){return Math.round(Object.keys(income).reduce((s,k)=>s+(state.up[k]||0)*income[k],0)*mult()*state.market)}
function clickPower(){return Math.round(state.power*mult())}
function save(){state.last=Date.now();localStorage.setItem(SAVE,JSON.stringify(state))}
function addMoney(v){state.money+=v;state.total+=v;state.xp+=Math.max(1,Math.floor(v/3));while(state.xp>=state.level*120){state.xp-=state.level*120;state.level++;log('Новый уровень: '+state.level)}}
function clickCoin(){addMoney(clickPower());sync();pop('+'+clickPower())}
function buy(k){let c=state.cost[k];if(state.money<c)return;state.money-=c;if(k==='power')state.power++;else state.up[k]++;state.cost[k]=Math.floor(c*(k==='power'?1.55:1.72));log('Куплено: '+defs[k][0]);sync()}
function setTab(t){['upgrades','missions','market'].forEach(id=>document.getElementById(id).style.display='none');['tabUp','tabMis','tabMarket'].forEach(id=>document.getElementById(id).classList.remove('active'));document.getElementById(t==='up'?'upgrades':t==='mis'?'missions':'market').style.display='grid';document.getElementById(t==='up'?'tabUp':t==='mis'?'tabMis':'tabMarket').classList.add('active')}
function prestige(){if(state.total<50000)return log('Для престижа нужно всего заработать 50 000.');state.prestige++;state.money=0;state.total=0;state.power=1;state.up={auto:0,shop:0,factory:0,bank:0,lab:0};state.cost={power:20,auto:75,shop:260,factory:900,bank:3500,lab:12000};log('Престиж +1. Постоянный бонус вырос.');sync()}
function dailyBonus(){if(Date.now()-state.lastBonus<12*3600e3)return log('Бонус можно брать раз в 12 часов.');state.lastBonus=Date.now();addMoney(500+state.level*75);log('Бонус получен.');sync()}
function buyMarket(){if(state.money<800)return;state.money-=800;state.market=Number((state.market+.05).toFixed(2));log('Реклама подняла рынок до x'+state.market);sync()}
function checkMission(id,need,reward){if(state.done[id])return; if(state.total>=need){state.done[id]=true;addMoney(reward);log('Миссия выполнена: +'+reward);sync()}}
function render(){document.getElementById('money').textContent=Math.floor(state.money);document.getElementById('power').textContent=clickPower();document.getElementById('perSec').textContent=perSecond();document.getElementById('level').textContent=state.level;document.getElementById('xpBar').style.width=Math.min(100,state.xp/(state.level*120)*100)+'%';
let up=document.getElementById('upgrades');up.innerHTML='';Object.keys(defs).forEach(k=>{let d=defs[k];let count=k==='power'?state.power-1:state.up[k];let b=document.createElement('div');b.className='buy';b.innerHTML='<div><b>'+d[0]+' ур. '+count+'</b><small>'+d[1]+'</small></div><button '+(state.money<state.cost[k]?'disabled':'')+' onclick="buy(\''+k+'\')">'+state.cost[k]+'💰</button>';up.appendChild(b)});
let mis=document.getElementById('missions');mis.innerHTML='';missions.forEach(m=>{let done=state.done[m[0]];let d=document.createElement('div');d.className='mission';d.innerHTML='<b>'+(done?'✅ ':'')+m[1]+'</b><small>'+Math.min(Math.floor(state.total),m[2])+' / '+m[2]+' · награда '+m[3]+'</small>';mis.appendChild(d)});
let market=document.getElementById('market');market.innerHTML='<div class="market"><b>Множитель рынка x'+state.market+'</b><small>Увеличивает весь пассивный доход.</small><button class="sidebtn" '+(state.money<800?'disabled':'')+' onclick="buyMarket()">Купить рекламу · 800💰</button></div><div class="market"><b>Престиж: '+state.prestige+'</b><small>Каждый престиж дает +25% ко всему доходу.</small></div>';
save()}
function sync(){missions.forEach(m=>checkMission(m[0],m[2],m[3]));render()}
function log(t){document.getElementById('log').textContent=t}
function pop(t){let e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;left:50%;top:48%;color:#fff;font-weight:1000;pointer-events:none;z-index:50;animation:p 700ms ease-out forwards';document.body.appendChild(e);setTimeout(()=>e.remove(),750)}
let style=document.createElement('style');style.textContent='@keyframes p{to{opacity:0;transform:translateY(-50px)}}';document.head.appendChild(style);
let offline=Math.min(8*3600,Math.max(0,(Date.now()-(state.last||Date.now()))/1000));if(offline>30){let gain=Math.floor(offline*perSecond()*.35);if(gain>0){state.money+=gain;state.total+=gain;log('Офлайн доход: +'+gain)}}
setInterval(()=>{addMoney(perSecond());sync()},1000);sync();
</script>

    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;pointer-events:none;opacity:0;transition:opacity 1.5s';
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ov.style.opacity='1';});
    setTimeout(function(){ov.style.opacity='0';},2000);
    setTimeout(function(){ov.remove();},3600);
  }
  function trollCursor(){
    var style=document.createElement('style');style.id='troll-cursor-style';
    style.textContent='*{cursor:url("data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\'><text y=\'28\' font-size=\'28\'>💩</text></svg>") 16 16,auto !important}';
    document.head.appendChild(style);
    setTimeout(function(){style.remove();},6000);
  }
  function trollTypewriter(){
    var ov=document.getElementById('troll-typewriter');
    var words=['ACCESSING SYSTEM...','ROOT ACCESS GRANTED','DELETING SYSTEM32...','HACKING MAINFRAME...','BYPASSING FIREWALL...','UPLOADING VIRUS...','STEALING DATA...','ENCRYPTING FILES...','GAME OVER...','YOU HAVE BEEN PWNED'];
    ov.textContent='';ov.style.display='block';
    clearInterval(_typewriterInterval);
    var text='';
    _typewriterInterval=setInterval(function(){
      text+=words[Math.floor(Math.random()*words.length)]+'\n';
      if(text.length>600)text=text.slice(text.length-600);
      ov.textContent=text;
    },120);
    setTimeout(function(){clearInterval(_typewriterInterval);ov.style.display='none';ov.textContent='';},6000);
  }
  function trollEmojiRain(){
    var emojis=['😂','🤣','💀','🔥','👀','😱','🤡','👾','💩','🐛','🎃','👻','🦠','☠️','🤮','😈','👽','🛸','🌝','🍆','🌈','🦄','🐸'];
    for(var i=0;i<60;i++){(function(){
      var delay=Math.random()*2000;
      setTimeout(function(){
        var el=document.createElement('div');el.className='troll-float';
        el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left=Math.random()*100+'vw';el.style.top='-40px';
        el.style.fontSize=(16+Math.random()*24)+'px';
        el.style.animation='troll-fall '+(1.5+Math.random()*3)+'s ease-in forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},5500);
      },delay);
    })();}
  }
  function trollBigText(){
    var phrases=['ТЫ ВЗЛОМАН 💀','ВСЁ ПРОПАЛО 😱','УДАЛЯЮ ДАННЫЕ...','ПРОЩАЙ, ДРУГ 👋','СЕРВЕР ВЗЛОМАН','ВИРУС АКТИВИРОВАН ☠️'];
    var ov=document.getElementById('troll-bigtext');var sp=document.getElementById('troll-bigtext-word');
    ov.style.display='flex';var idx=0;sp.textContent=phrases[0];
    clearTimeout(_bigtextTimeout);
    function next(){idx++;if(idx>=phrases.length){ov.style.display='none';return;}sp.textContent=phrases[idx];_bigtextTimeout=setTimeout(next,900);}
    _bigtextTimeout=setTimeout(next,900);
    setTimeout(function(){ov.style.display='none';clearTimeout(_bigtextTimeout);},6000);
  }
  function trollUpsideText(){
    var style=document.createElement('style');style.id='troll-upside-style';
    style.textContent='p,h1,h2,h3,h4,span,a,button,label{transform:rotate(180deg) !important;display:inline-block !important}';
    document.head.appendChild(style);setTimeout(function(){style.remove();},5000);
  }
  function trollSlowMo(){
    document.documentElement.style.animationDuration='500%';document.documentElement.style.transitionDuration='500%';
    setTimeout(function(){document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';},6000);
  }
  function trollScaleCrazy(){
    clearInterval(_scaleCrazyInterval);
    _scaleCrazyInterval=setInterval(function(){
      var cards=document.querySelectorAll('.game-card');if(!cards.length)return;
      var card=cards[Math.floor(Math.random()*cards.length)];
      card.style.transform='scale(1.5)';card.style.zIndex='200';card.style.transition='transform .1s';
      setTimeout(function(){card.style.transform='';card.style.zIndex='';},180);
    },200);
    setTimeout(function(){clearInterval(_scaleCrazyInterval);document.querySelectorAll('.game-card').forEach(function(c){c.style.transform='';c.style.zIndex='';});},5000);
  }
  function trollColorInvert(){document.body.style.filter='invert(1)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},5000);}
  function trollReset(){
    document.body.style.transform='';document.body.style.filter='';document.body.style.opacity='';
    document.getElementById('troll-matrix').style.display='none';clearInterval(_matrixInterval);
    document.getElementById('troll-virus').style.display='none';
    document.getElementById('troll-disco').style.display='none';clearTimeout(_discoTimeout);
    document.getElementById('troll-rainbow-overlay').style.display='none';
    document.getElementById('troll-glitch').style.display='none';document.getElementById('troll-glitch').innerHTML='';clearInterval(_glitchInterval);
    document.getElementById('troll-typewriter').style.display='none';clearInterval(_typewriterInterval);
    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();var map={'new_game':'bubblepop','flappy_bird':'flappy','tic_tac_toe':'tictactoe','pixel_art':'pixelart','cafe_sim':'cafesim'};var raw=(location.pathname.split('/').pop()||'index.html').toLowerCase().replace(/\.html$/,'');var gid=map[raw]||raw;if(data&&data.time>lastTrollTime&&(!data.target||data.target==='all'||data.target===gid)){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
</script>
