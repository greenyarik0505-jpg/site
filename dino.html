<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Runner</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#202020,#0f0f0f 70%)}
.portal-home-btn{position:fixed;top:12px;left:12px;z-index:10050;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.58);color:#fff;padding:9px 14px;border-radius:14px;font:800 13px Arial,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.wrap{width:min(94vmin,760px);display:grid;gap:12px;justify-items:center}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-weight:900}
.title{font-size:clamp(22px,6vw,38px);color:#feca57;text-shadow:0 0 16px rgba(254,202,87,.35)}
.score-box{font-size:16px;color:#eee;display:flex;gap:15px}
.score-box span{color:#48dbfb}
canvas{width:100%;aspect-ratio:8/3;border:3px solid rgba(255,255,255,.16);border-radius:18px;background:#222;box-shadow:0 20px 50px rgba(0,0,0,.55);transition:background-color .5s,border-color .5s}
.btn-container{display:flex;gap:12px;width:100%;justify-content:center;align-items:center;margin-top:4px}
.controls{display:flex;gap:15px}
.controls button,.start{border:0;border-radius:14px;background:#feca57;color:#111;font-weight:900;font-size:18px;cursor:pointer;box-shadow:0 6px 0 #cf9d26;transition:transform .1s}
.controls button{width:70px;height:54px;font-size:20px;display:flex;align-items:center;justify-content:center}
.controls button:active,.start:active{transform:translateY(4px);box-shadow:0 2px 0 #cf9d26}
.start{padding:12px 24px;font-size:16px}
.note{color:rgba(255,255,255,.65);font-size:13px;text-align:center;line-height:1.4}
</style>
</head>
<body>
<a class="portal-home-btn" href="index.html">Главное меню</a>
<main class="wrap">
  <div class="hud">
    <div class="title">Dino Runner</div>
    <div class="score-box">
      <div>Счет: <span id="score">0</span></div>
      <div>Рекорд: <span id="highscore">0</span></div>
    </div>
  </div>
  <canvas id="game" width="800" height="300"></canvas>
  <div class="btn-container">
    <button class="start" id="startBtn">Старт / заново</button>
    <div class="controls" aria-label="Управление">
      <button class="downBtn" id="downBtn">▼</button>
      <button class="upBtn" id="upBtn">▲</button>
    </div>
  </div>
  <div class="note">Стрелки или кнопки на экране. Перепрыгивай препятствия и приседай.</div>
</main>

<script>
// Web Audio Synth
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'jump') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'point') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(700, now);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
      
      setTimeout(() => {
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(900, audioCtx.currentTime);
        gain2.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        osc2.start(audioCtx.currentTime);
        osc2.stop(audioCtx.currentTime + 0.08);
      }, 90);
    } else if (type === 'die') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.45);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.start(now);
      osc.stop(now + 0.45);
    }
  } catch (e) {
    console.warn('Audio play failed:', e);
  }
}

const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score'), highscoreEl = document.getElementById('highscore');

// Game constants
const GROUND_Y = 245;
const DINO_WIDTH = 44;
const DINO_HEIGHT = 47;
const DINO_DUCK_HEIGHT = 30;

let dino, obstacles, particles, clouds, stars;
let score, highscore, speed, running, gameTime, dayNightTick, lastScoreTick, isNight;

// Load highscore
try {
  highscore = parseInt(localStorage.getItem('dino_highscore')) || 0;
} catch(e) {
  highscore = 0;
}
highscoreEl.textContent = highscore;

class Dino {
  constructor() {
    this.x = 60;
    this.y = GROUND_Y - DINO_HEIGHT;
    this.vy = 0;
    this.width = DINO_WIDTH;
    this.height = DINO_HEIGHT;
    this.isJumping = false;
    this.isDucking = false;
    this.gravity = 0.65;
    this.jumpForce = -13;
    this.animFrame = 0;
  }
  jump() {
    if (!this.isJumping && !this.isDucking) {
      this.vy = this.jumpForce;
      this.isJumping = true;
      playSound('jump');
    }
  }
  duck(state) {
    this.isDucking = state;
    if (state) {
      this.height = DINO_DUCK_HEIGHT;
      this.width = DINO_WIDTH + 6;
      if (!this.isJumping) this.y = GROUND_Y - DINO_DUCK_HEIGHT;
    } else {
      this.height = DINO_HEIGHT;
      this.width = DINO_WIDTH;
      if (!this.isJumping) this.y = GROUND_Y - DINO_HEIGHT;
    }
  }
  update() {
    // Physics
    this.y += this.vy;
    this.vy += this.gravity;
    
    if (this.y >= GROUND_Y - this.height) {
      this.y = GROUND_Y - this.height;
      this.vy = 0;
      this.isJumping = false;
    }
    
    // Animation frame
    if (gameTime % 6 === 0) {
      this.animFrame = (this.animFrame + 1) % 2;
    }
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = isNight ? '#9cff7c' : 'rgba(0,0,0,0.2)';
    ctx.fillStyle = isNight ? '#9cff7c' : '#555';
    
    const x = this.x;
    const y = this.y;
    const w = this.width;
    const h = this.height;
    
    if (this.isDucking && !this.isJumping) {
      // Ducking Dino shape
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 6);
      ctx.fill();
      // Head
      ctx.beginPath();
      ctx.arc(x + w - 4, y + 8, 8, 0, Math.PI*2);
      ctx.fill();
      // Tail
      ctx.beginPath();
      ctx.moveTo(x, y + 10);
      ctx.lineTo(x - 8, y + h - 5);
      ctx.lineTo(x + 10, y + h);
      ctx.closePath();
      ctx.fill();
      
      // Animated legs
      ctx.fillStyle = isNight ? '#7cdd5c' : '#333';
      const legOffset = this.animFrame ? 4 : 0;
      ctx.fillRect(x + 10 + legOffset, y + h, 6, 6);
      ctx.fillRect(x + w - 18 - legOffset, y + h, 6, 6);
    } else {
      // Normal Dino shape
      ctx.beginPath();
      ctx.roundRect(x + 5, y + 12, w - 10, h - 14, 8); // body
      ctx.fill();
      // Head
      ctx.beginPath();
      ctx.roundRect(x + 16, y, w - 16, 18, 6);
      ctx.fill();
      // Snout
      ctx.fillRect(x + 24, y + 18, 12, 4);
      // Neck
      ctx.fillRect(x + 16, y + 14, 14, 8);
      // Tail
      ctx.beginPath();
      ctx.moveTo(x + 5, y + 20);
      ctx.lineTo(x - 10, y + 36);
      ctx.lineTo(x + 10, y + 36);
      ctx.closePath();
      ctx.fill();
      
      // Eye
      ctx.fillStyle = isNight ? '#111' : '#fff';
      ctx.fillRect(x + w - 12, y + 4, 3, 3);
      
      // Animated legs
      ctx.fillStyle = isNight ? '#7cdd5c' : '#333';
      const legOffset = this.animFrame ? 5 : 0;
      ctx.fillRect(x + 12 + legOffset, y + h - 2, 7, 7);
      ctx.fillRect(x + w - 18 - legOffset, y + h - 2, 7, 7);
    }
    ctx.restore();
  }
}

class Obstacle {
  constructor() {
    this.x = canvas.width + 50;
    this.type = Math.random() < 0.7 ? 'cactus' : 'bird';
    
    if (this.type === 'cactus') {
      this.width = Math.random() < 0.5 ? 18 : 34; // single or double
      this.height = Math.random() < 0.5 ? 35 : 48; // short or tall
      this.y = GROUND_Y - this.height;
    } else {
      // Bird
      this.width = 34;
      this.height = 24;
      // High, mid, or low flight path
      const heights = [GROUND_Y - 75, GROUND_Y - 45, GROUND_Y - 20];
      this.y = heights[Math.floor(Math.random() * heights.length)];
      this.animFrame = 0;
    }
  }
  update() {
    this.x -= speed;
    if (this.type === 'bird' && gameTime % 12 === 0) {
      this.animFrame = (this.animFrame + 1) % 2;
    }
  }
  draw() {
    ctx.save();
    ctx.shadowBlur = 10;
    ctx.shadowColor = isNight ? '#ff4d4d' : 'rgba(0,0,0,0.15)';
    ctx.fillStyle = isNight ? '#ff4d4d' : '#e65c5c';
    
    if (this.type === 'cactus') {
      ctx.beginPath();
      ctx.roundRect(this.x, this.y, this.width, this.height, 4);
      ctx.fill();
      // Side branches
      if (this.width > 20) {
        ctx.fillRect(this.x - 4, this.y + 12, 4, 10);
        ctx.fillRect(this.x + this.width, this.y + 8, 4, 12);
      }
    } else {
      // Bird shape
      ctx.beginPath();
      ctx.roundRect(this.x, this.y, this.width, this.height, 6);
      ctx.fill();
      // Flapping wings
      ctx.fillStyle = isNight ? '#ff6666' : '#d64c4c';
      if (this.animFrame) {
        // Wings up
        ctx.beginPath();
        ctx.moveTo(this.x + 8, this.y);
        ctx.lineTo(this.x + 14, this.y - 12);
        ctx.lineTo(this.x + 22, this.y);
        ctx.closePath();
        ctx.fill();
      } else {
        // Wings down
        ctx.beginPath();
        ctx.moveTo(this.x + 8, this.y + this.height);
        ctx.lineTo(this.x + 14, this.y + this.height + 12);
        ctx.lineTo(this.x + 22, this.y + this.height);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.size = Math.random() * 4 + 2;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6;
    this.color = color;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.015;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.restore();
  }
}

// Environment elements
class Cloud {
  constructor() {
    this.x = canvas.width + 100;
    this.y = Math.random() * 80 + 30;
    this.speed = Math.random() * 0.5 + 0.2;
    this.width = Math.random() * 40 + 40;
  }
  update() {
    this.x -= this.speed;
  }
  draw() {
    ctx.fillStyle = isNight ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
    ctx.beginPath();
    ctx.roundRect(this.x, this.y, this.width, 14, 7);
    ctx.fill();
  }
}

class Star {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * 120;
    this.size = Math.random() * 1.5 + 0.5;
  }
  update() {
    this.x -= 0.05;
    if (this.x < 0) this.x = canvas.width;
  }
  draw() {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(this.x, this.y, this.size, this.size);
  }
}

function init() {
  dino = new Dino();
  obstacles = [];
  particles = [];
  clouds = [];
  stars = [];
  for (let i = 0; i < 15; i++) stars.push(new Star());
  
  score = 0;
  speed = 6.2;
  gameTime = 0;
  dayNightTick = 0;
  lastScoreTick = 0;
  isNight = false;
  running = true;
  
  scoreEl.textContent = score;
  canvas.style.backgroundColor = '#f7f7f7';
  canvas.style.borderColor = 'rgba(0,0,0,0.16)';
  
  loop();
}

function triggerExplosion(x, y, color) {
  for (let i = 0; i < 20; i++) {
    particles.push(new Particle(x, y, color));
  }
}

function checkCollision(a, b) {
  const padA = 5;
  const padB = 4;
  return a.x + padA < b.x + b.width - padB &&
         a.x + a.width - padA > b.x + padB &&
         a.y + padA < b.y + b.height - padB &&
         a.y + a.height - padA > b.y + padB;
}

function gameOver() {
  running = false;
  playSound('die');
  triggerExplosion(dino.x + dino.width/2, dino.y + dino.height/2, isNight ? '#9cff7c' : '#555');
  
  if (score > highscore) {
    highscore = score;
    highscoreEl.textContent = highscore;
    try {
      localStorage.setItem('dino_highscore', highscore);
    } catch(e) {}
  }
  
  // Render Game Over text
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = '900 36px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width/2, canvas.height/2 - 10);
  ctx.font = '700 16px Arial';
  ctx.fillStyle = '#ff7675';
  ctx.fillText('Нажми кнопку "Старт / заново" для перезапуска', canvas.width/2, canvas.height/2 + 25);
  ctx.restore();
}

function loop() {
  if (!running) return;
  requestAnimationFrame(loop);
  
  gameTime++;
  dayNightTick++;
  
  // Day/Night switch every 700 ticks
  if (dayNightTick >= 700) {
    dayNightTick = 0;
    isNight = !isNight;
    canvas.style.backgroundColor = isNight ? '#181a1b' : '#f7f7f7';
    canvas.style.borderColor = isNight ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.16)';
  }
  
  // Score tick
  if (gameTime % 5 === 0) {
    score++;
    scoreEl.textContent = score;
    
    // Play point beep every 100 points
    if (score > 0 && score % 100 === 0) {
      playSound('point');
      speed += 0.35; // Accelerate
    }
  }
  
  // Clear Canvas
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Draw environment (stars in night mode)
  if (isNight) {
    stars.forEach(s => { s.update(); s.draw(); });
  }
  
  // Clouds spawning
  if (Math.random() < 0.006 && clouds.length < 5) {
    clouds.push(new Cloud());
  }
  clouds.forEach((c, idx) => {
    c.update();
    c.draw();
    if (c.x + c.width < 0) clouds.splice(idx, 1);
  });
  
  // Obstacles spawning
  if (gameTime - lastScoreTick > Math.max(50, 110 - speed * 4)) {
    if (Math.random() < 0.45) {
      obstacles.push(new Obstacle());
      lastScoreTick = gameTime;
    }
  }
  
  // Ground
  ctx.strokeStyle = isNight ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.1)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(canvas.width, GROUND_Y);
  ctx.stroke();
  
  // Draw ground bumps
  ctx.fillStyle = isNight ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.05)';
  for (let i = 0; i < canvas.width; i += 80) {
    const offset = (gameTime * speed) % 80;
    ctx.fillRect(i - offset + 15, GROUND_Y + 4, 16, 2);
    ctx.fillRect(i - offset + 45, GROUND_Y + 12, 8, 2);
  }
  
  // Update & Draw Obstacles
  obstacles.forEach((o, idx) => {
    o.update();
    o.draw();
    
    // Check Collision
    if (checkCollision(dino, o)) {
      gameOver();
    }
    
    // Remove offscreen obstacles
    if (o.x + o.width < -100) obstacles.splice(idx, 1);
  });
  
  // Update & Draw Particles
  particles.forEach((p, idx) => {
    p.update();
    p.draw();
    if (p.alpha <= 0) particles.splice(idx, 1);
  });
  
  // Update & Draw Dino
  dino.update();
  dino.draw();
}

// Input listeners
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    dino.jump();
  }
  if (e.code === 'ArrowDown') {
    e.preventDefault();
    dino.duck(true);
  }
});

document.addEventListener('keyup', e => {
  if (e.code === 'ArrowDown') {
    dino.duck(false);
  }
});

// Touch buttons listeners
const upBtn = document.getElementById('upBtn');
const downBtn = document.getElementById('downBtn');
const startBtn = document.getElementById('startBtn');

upBtn.addEventListener('touchstart', e => { e.preventDefault(); dino.jump(); });
downBtn.addEventListener('touchstart', e => { e.preventDefault(); dino.duck(true); });
downBtn.addEventListener('touchend', e => { e.preventDefault(); dino.duck(false); });

// Mouse listeners fallback for buttons
upBtn.addEventListener('mousedown', () => dino.jump());
downBtn.addEventListener('mousedown', () => dino.duck(true));
downBtn.addEventListener('mouseup', () => dino.duck(false));
downBtn.addEventListener('mouseleave', () => dino.duck(false));

startBtn.onclick = init;

// Splash Screen init
ctx.fillStyle = '#222';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#feca57';
ctx.font = '900 32px Arial';
ctx.textAlign = 'center';
ctx.fillText('Dino Runner', canvas.width/2, canvas.height/2 - 15);
ctx.font = '700 15px Arial';
ctx.fillStyle = '#fff';
ctx.fillText('Нажми кнопку "Старт / заново" для запуска!', canvas.width/2, canvas.height/2 + 25);
</script>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
#troll-matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;display:none}
#troll-virus{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:#000;justify-content:center;align-items:center;flex-direction:column;cursor:pointer}
#troll-virus h1{color:#0f0;font-size:clamp(20px,5vw,36px);text-align:center;font-family:monospace;animation:troll-blink .5s infinite}
#troll-virus p{color:#0f0;font-size:14px;margin-top:10px;font-family:monospace}
@keyframes troll-blink{50%{opacity:.3}}
#troll-disco{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;animation:troll-disco-anim .2s infinite}
@keyframes troll-disco-anim{0%{background:rgba(255,0,0,.35)}25%{background:rgba(0,0,255,.35)}50%{background:rgba(0,255,0,.35)}75%{background:rgba(255,255,0,.35)}100%{background:rgba(128,0,128,.35)}}
.troll-confetti{position:fixed;width:10px;height:10px;z-index:9998;pointer-events:none;animation:troll-confetti-fall 3s ease-out forwards}
@keyframes troll-confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
#troll-rainbow-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9997;pointer-events:none;outline:8px solid red;animation:troll-rainbow-border .5s linear infinite}
@keyframes troll-rainbow-border{0%{outline-color:#f00}15%{outline-color:#f80}30%{outline-color:#ff0}45%{outline-color:#0f0}60%{outline-color:#0ff}75%{outline-color:#00f}90%{outline-color:#f0f}100%{outline-color:#f00}}
#troll-glitch{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9997;pointer-events:none}
#troll-typewriter{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;background:rgba(0,0,0,.88);color:#0f0;font-family:monospace;font-size:clamp(10px,1.8vw,15px);padding:20px;overflow:hidden;pointer-events:none;white-space:pre-wrap;word-break:break-all}
#troll-bigtext{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,.75);justify-content:center;align-items:center;pointer-events:none;flex-direction:column}
#troll-bigtext span{font-size:clamp(32px,10vw,80px);font-weight:900;color:#ff0000;text-shadow:0 0 30px #ff0000,0 0 60px #ff6600;text-align:center;animation:troll-bigpulse .4s infinite}

  function trollFlip(){document.body.style.transform='rotate(180deg)';document.body.style.transition='transform 1s';setTimeout(function(){document.body.style.transform='';},5000);}

    var mc=document.getElementById('troll-matrix');

    var mctx=mc.getContext('2d');
    mc.width=window.innerWidth;mc.height=window.innerHeight;
    var cols=Math.floor(mc.width/14);

    var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';

  function trollGravity(){}

  function trollZoom(){
    var t=0;
    var int=setInterval(function(){var s=1+0.06*Math.sin(t*0.3);document.body.style.transform='scale('+s+')';t++;},50);
    setTimeout(function(){clearInterval(int);document.body.style.transform='';},6000);
  }
  function trollGhost(){
    var t=0;
    var int=setInterval(function(){var o=0.5+0.5*Math.sin(t*0.6);document.body.style.opacity=Math.max(0.02,o).toString();t++;},40);
    setTimeout(function(){clearInterval(int);document.body.style.opacity='';},5000);
  }
  function trollGlitch(){
    var ov=document.getElementById('troll-glitch');ov.style.display='block';
    clearInterval(_glitchInterval);
    _glitchInterval=setInterval(function(){
      var bars=[];
      for(var i=0;i<8;i++){
        var y=Math.random()*100,h=Math.random()*6+1,color='hsl('+Math.floor(Math.random()*360)+',100%,50%)',x=(Math.random()-.5)*30;
        bars.push('<div style="position:absolute;top:'+y+'%;left:0;width:100%;height:'+h+'%;background:'+color+';opacity:.55;transform:translateX('+x+'px)"></div>');
      }
      ov.innerHTML=bars.join('');
    },80);
    setTimeout(function(){clearInterval(_glitchInterval);ov.style.display='none';ov.innerHTML='';},5000);
  }

    var emojis=['❄️','⛄','🌨️'];

        el.style.fontSize=(20+Math.random()*20)+'px';
        el.style.animation='troll-fall '+(3+Math.random()*4)+'s ease-in forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},8000);
      },delay);
    })();}
  }
  function trollBubble(){
    var emojis=['🫧','💫','🎈','✨'];

    setTimeout(function(){document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';},6000);

  function trollScaleCrazy(){
    clearInterval(_scaleCrazyInterval);

  }
  function trollColorInvert(){document.body.style.filter='invert(1)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},5000);}
