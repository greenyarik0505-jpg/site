<html lang="ru">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dino Runner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;color:#fff;font-family:'VT323', monospace;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:center;justify-content:center;transition:background-color .5s}

#game-container {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: #f7f7f7;
    transition: background-color 0.5s, border-color 0.5s;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

.portal-home-btn{
    position:fixed;
    top:12px;
    left:12px;
    z-index:10050;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.58);
    color:#fff;
    padding:9px 14px;
    border-radius:14px;
    font:800 13px Arial,sans-serif;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(0,0,0,.28);
    backdrop-filter:blur(8px);
    transition: transform .1s;
}
.portal-home-btn:active{transform:scale(.95)}

/* --- КНОПКА ПАУЗЫ (HUD) --- */
#hud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 0;
    z-index: 20;
}

.btn-pause-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 50px;
    height: 50px;
    background: #feca57;
    border: 3px solid #fff;
    border-radius: 8px;
    color: #111;
    font-size: 24px;
    font-family: 'VT323', monospace;
    cursor: pointer;
    box-shadow: 0 4px 0 #cf9d26;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto;
    transition: transform 0.1s, box-shadow 0.1s;
}
.btn-pause-icon:active {
    transform: translateY(4px);
    box-shadow: none;
}

/* --- ЭКРАНЫ UI --- */
.ui-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 30;
}

.menu-box {
    background: rgba(30, 30, 30, 0.9);
    border: 4px solid #feca57;
    padding: 24px;
    border-radius: 12px;
    text-align: center;
    width: 300px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    pointer-events: auto;
    backdrop-filter: blur(10px);
    color: #fff;
    font-family: 'VT323', monospace;
    transition: border-color 0.5s;
}

h1 {
    font-size: 3rem;
    margin: 0 0 10px 0;
    color: #feca57;
    text-shadow: 2px 2px 0 #000;
    line-height: 1;
}

.score-live {
    position: absolute;
    top: 8%;
    width: 100%;
    text-align: center;
    font-size: 4.5rem;
    color: #333;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
    z-index: 5;
    pointer-events: none;
    font-weight: bold;
    transition: color 0.5s;
}

.btn {
    display: block;
    width: 100%;
    margin: 10px 0;
    background: #feca57;
    border: 2px solid #fff;
    color: #111;
    font-family: 'VT323', monospace;
    font-size: 1.8rem;
    padding: 8px;
    cursor: pointer;
    box-shadow: 0 4px 0 #cf9d26;
    text-transform: uppercase;
    border-radius: 8px;
    font-weight: 900;
    transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active {
    transform: translateY(4px);
    box-shadow: none;
}
.btn-red {
    background: #ff7675;
    box-shadow: 0 4px 0 #c23616;
    color: #fff;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 1.6rem;
    color: #eee;
    margin: 8px 0;
    border-bottom: 2px dashed rgba(255,255,255,0.2);
}

.hidden { display: none !important; }



/* TROLL SYSTEM STYLES */
#troll-matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;pointer-events:none;display:none}
#troll-virus{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:10000;background:#000;justify-content:center;align-items:center;flex-direction:column;cursor:pointer}
#troll-virus h1{color:#0f0;font-size:clamp(20px,5vw,36px);text-align:center;font-family:monospace;animation:troll-blink .5s infinite}
#troll-virus p{color:#0f0;font-size:14px;margin-top:10px;font-family:monospace}
@keyframes troll-blink{50%{opacity:.3}}
#troll-disco{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;pointer-events:none;animation:troll-disco-anim .2s infinite}
@keyframes troll-disco-anim{0%{background:rgba(255,0,0,.35)}25%{background:rgba(0,0,255,.35)}50%{background:rgba(0,255,0,.35)}75%{background:rgba(255,255,0,.35)}100%{background:rgba(128,0,128,.35)}}
.troll-confetti{position:fixed;width:10px;height:10px;z-index:9998;pointer-events:none;animation:troll-confetti-fall 3s ease-out forwards}
@keyframes troll-confetti-fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
#troll-rainbow-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9997;pointer-events:none;outline:8px solid red;animation:troll-rainbow-border .5s linear infinite}
@keyframes troll-rainbow-border{0%{outline-color:#f00}15%{outline-color:#f80}30%{outline-color:#ff0}45%{outline-color:#0f0}60%{outline-color:#0ff}75%{outline-color:#00f}90%{outline-color:#f0f}100%{outline-color:#f00}}
#troll-glitch{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9997;pointer-events:none}
#troll-typewriter{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9998;background:rgba(0,0,0,.88);color:#0f0;font-family:monospace;font-size:clamp(10px,1.8vw,15px);padding:20px;overflow:hidden;pointer-events:none;white-space:pre-wrap;word-break:break-all}
#troll-bigtext{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;background:rgba(0,0,0,.75);justify-content:center;align-items:center;pointer-events:none;flex-direction:column}
#troll-bigtext span{font-size:clamp(32px,10vw,80px);font-weight:900;color:#ff0000;text-shadow:0 0 30px #ff0000,0 0 60px #ff6600;text-align:center;animation:troll-bigpulse .4s infinite}
@keyframes troll-bigpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.troll-float{position:fixed;pointer-events:none;z-index:9998;animation-fill-mode:forwards;line-height:1}
@keyframes troll-fall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
@keyframes troll-rise{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(-110vh) rotate(-360deg)}}
#troll-broadcast{display:none;position:fixed;bottom:0;left:0;right:0;z-index:10001;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:14px 24px 18px;font-size:15px;font-weight:700;text-align:center;box-shadow:0 -4px 20px rgba(108,92,231,.5);animation:troll-banner-slide .4s ease-out;cursor:pointer}

// --- AUDIO SYNTH ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function resumeAudio() {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

function playSound(type) {
    try {
        resumeAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.12);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
            osc.start(now);
            osc.stop(now + 0.12);
        } else if (type === 'point') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(700, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
            
            setTimeout(() => {
                try {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.type = 'square';
                    osc2.frequency.setValueAtTime(900, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc2.start(audioCtx.currentTime);
                    osc2.stop(audioCtx.currentTime + 0.08);
                } catch(e){}
            }, 90);
        } else if (type === 'die') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.45);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
            osc.start(now);
            osc.stop(now + 0.45);
        }
    } catch (e) {
        console.warn('Audio play failed:', e);
    }
}

// Helper to draw pixel sprite
function drawSprite(ctx, sprite, x, y, pixelSize, colorMap) {
    for (let r = 0; r < sprite.length; r++) {
        const row = sprite[r];
        for (let c = 0; c < row.length; c++) {
            const char = row[c];
            if (char !== ' ') {
                ctx.fillStyle = colorMap[char] || '#fff';
                ctx.fillRect(x + c * pixelSize, y + r * pixelSize, pixelSize, pixelSize);
            }
        }
    }
}

// Lerp color helper for smooth Day/Night cycles
function lerpColor(color1, color2, factor) {
    const r1 = parseInt(color1.substring(1, 3), 16);
    const g1 = parseInt(color1.substring(3, 5), 16);
    const b1 = parseInt(color1.substring(5, 7), 16);
    
    const r2 = parseInt(color2.substring(1, 3), 16);
    const g2 = parseInt(color2.substring(3, 5), 16);
    const b2 = parseInt(color2.substring(5, 7), 16);
    
    const r = Math.round(r1 + (r2 - r1) * factor);
    const g = Math.round(g1 + (g2 - g1) * factor);
    const b = Math.round(b1 + (b2 - b1) * factor);
    
    return `rgb(${r},${g},${b})`;
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const oldGround = GROUND_Y;
    const aspect = canvas.width / canvas.height;
    if (aspect > 800 / 300) {
        logicalHeight = 300;
        logicalWidth = 300 * aspect;
        scale = canvas.height / logicalHeight;
    } else {
        logicalWidth = 800;
        logicalHeight = 800 / aspect;
        scale = canvas.width / logicalWidth;
    }
    GROUND_Y = Math.round(logicalHeight / 2 + 50);
    
    // Adjust entity positions on window resize
    if (dino) {
        if (!dino.isJumping) {
            dino.y = GROUND_Y - DINO_HEIGHT;
        } else {
            dino.y += (GROUND_Y - oldGround);
        }
    }
    if (obstacles) {
        obstacles.forEach(o => {
            o.y += (GROUND_Y - oldGround);
        });
    }
}
window.addEventListener('resize', resize);
resize();

// --- ENTITIES CLASS ---
class Dino {
    constructor() {
        this.x = 80;
        this.y = GROUND_Y - DINO_HEIGHT;
        this.vy = 0;
        this.width = DINO_WIDTH;
        this.height = DINO_HEIGHT;
        this.isJumping = false;
        this.gravity = 0.6;
        this.jumpForce = -12.5;
        this.animFrame = 0;
    }
    jump() {
        if (state.current !== state.game || isPaused) return;
        if (!this.isJumping) {
            this.vy = this.jumpForce;
            this.isJumping = true;
            playSound('jump');
        }
    }
    update() {
        // Physics
        this.y += this.vy;
        
        let activeGravity = this.gravity * trollGravityMultiplier;
        this.vy += activeGravity;
        
        if (this.y >= GROUND_Y - DINO_HEIGHT) {
            this.y = GROUND_Y - DINO_HEIGHT;
            this.vy = 0;
            this.isJumping = false;
        }
        
        // Animation
        if (gameTime % 6 === 0) {
            this.animFrame = (this.animFrame + 1) % 2;
        }
    }
    draw() {
        let bodyColor = lerpColor('#333333', '#9cff7c', nightFade);
        let eyeColor = lerpColor('#ffffff', '#181a1b', nightFade);
        let pupilColor = lerpColor('#000000', '#9cff7c', nightFade);
        
        const colorMap = { 'X': bodyColor, 'O': eyeColor, 'E': pupilColor, '+': bodyColor };
        
        if (state.current === state.over) {
            drawSprite(ctx, DINO_CRASH, this.x, this.y, 2, colorMap);
        } else {
            const sprite = (this.isJumping || this.animFrame === 0) ? DINO_RUN1 : DINO_RUN2;
            drawSprite(ctx, sprite, this.x, this.y, 2, colorMap);
        }
    }
}

class Obstacle {
    constructor() {
        this.x = logicalWidth + 50;
        this.type = Math.random() < 0.75 ? 'cactus' : 'bird';
        
        if (this.type === 'cactus') {
            const rand = Math.random();
            if (rand < 0.35) {
                this.sprite = CACTUS_SMALL;
                this.width = 18;
                this.height = 36;
            } else if (rand < 0.7) {
                this.sprite = CACTUS_LARGE;
                this.width = 24;
                this.height = 48;
            } else {
                this.sprite = CACTUS_DOUBLE;
                this.width = 42;
                this.height = 36;
            }
            this.y = GROUND_Y - this.height;
        } else {
            // Bird
            this.width = 40;
            this.height = 24;
            // Heights: high (run under) or low (jump over), no mid bird (no ducking)
            const heights = [GROUND_Y - 80, GROUND_Y - 25];
            this.y = heights[Math.floor(Math.random() * heights.length)];
            this.animFrame = 0;
        }
    }
    update(activeSpeed) {
        this.x -= activeSpeed;
        if (this.type === 'bird' && gameTime % 12 === 0) {
            this.animFrame = (this.animFrame + 1) % 2;
        }
    }
    draw() {
        let color = lerpColor('#555555', '#ff4d4d', nightFade);
        const colorMap = { 'X': color };
        
        if (this.type === 'cactus') {
            drawSprite(ctx, this.sprite, this.x, this.y, 2, colorMap);
        } else {
            const sprite = this.animFrame ? BIRD_UP : BIRD_DOWN;
            drawSprite(ctx, sprite, this.x, this.y, 2, colorMap);
        }
    }
}

class Particle {
    constructor(x, y, color, vx, vy, size) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size || Math.random() * 3 + 1.5;
        this.alpha = 1;
        this.decay = Math.random() * 0.03 + 0.02;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

class Cloud {
    constructor() {
        this.x = logicalWidth + 80;
        this.y = Math.random() * 80 + 20;
        this.speed = Math.random() * 0.4 + 0.2;
    }
    update() {
        this.x -= this.speed;
    }
    draw() {
        let color = lerpColor('rgba(0,0,0,0.06)', 'rgba(255,255,255,0.06)', nightFade);
        drawSprite(ctx, CLOUD, this.x, this.y, 2, { 'X': color });
    }
}

class Star {
    constructor() {
        this.x = Math.random() * logicalWidth;
        this.y = Math.random() * 100;
        this.size = Math.random() * 1.5 + 0.5;
        this.twinkleOffset = Math.random() * Math.PI;
    }
    update() {
        this.x -= 0.05;
        if (this.x < -10) this.x = logicalWidth + 10;
    }
    draw() {
        // twinkle
        const alpha = 0.2 + 0.6 * Math.sin(Date.now() / 250 + this.twinkleOffset);
        ctx.save();
        ctx.globalAlpha = alpha * nightFade; // fade in/out with night cycle
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}

// --- SYSTEM INITIALIZATION ---

function init() {
    dino = new Dino();
    obstacles = [];
    particles = [];
    clouds = [];
    stars = [];
    for (let i = 0; i < 15; i++) {
        stars.push(new Star());
    }
    
    score = 0;
    speed = 6.2;
    gameTime = 0;
    dayNightTick = 0;
    lastScoreTick = 0;
    isNight = false;
    nightFade = 0;
    isPaused = false;
}

function triggerExplosion(x, y, color) {
    for (let i = 0; i < 35; i++) {
        const vx = (Math.random() - 0.5) * 8;
        const vy = (Math.random() - 0.5) * 8 - 3;
        particles.push(new Particle(x, y, color, vx, vy, Math.random() * 5 + 2));
    }
}

function checkCollision(d, o) {
    const padX = 6;
    const padY = 4;
    return d.x + padX < o.x + o.width - padX &&
           d.x + d.width - padX > o.x + padX &&
           d.y + padY < o.y + o.height - padY &&
           d.y + d.height - padY > o.y + padY;
}

function showStartScreen() {
    state.current = state.getReady;
    init();
    
    startScreen.classList.remove('hidden');
    hudLayer.classList.add('hidden');
    scoreEl.classList.add('hidden');
    pauseMenu.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
}

function startGame() {
    resumeAudio();
    state.current = state.game;
    isPaused = false;
    
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    pauseMenu.classList.add('hidden');
    
    hudLayer.classList.remove('hidden');
    scoreEl.classList.remove('hidden');
    scoreEl.textContent = score;
}

function gameOver() {
    if (state.current === state.over) return;
    state.current = state.over;
    playSound('die');
    
    let crashColor = lerpColor('#555555', '#ff4d4d', nightFade);
    triggerExplosion(dino.x + dino.width/2, dino.y + dino.height/2, crashColor);
    
    hudLayer.classList.add('hidden');
    if (score > highscore) {
        highscore = score;
        localStorage.setItem('dino_highscore', highscore);
        document.getElementById('start-best-score').textContent = highscore;
    }
    
    document.getElementById('end-score').textContent = score;
    document.getElementById('best-score').textContent = highscore;
    scoreEl.classList.add('hidden');
    
    gameOverScreen.classList.remove('hidden');
}

function togglePause(e) {
    if (e) e.stopPropagation();
    if (state.current !== state.game && state.current !== state.paused) return;
    
    resumeAudio();
    if (state.current === state.game) {
        state.current = state.paused;
        isPaused = true;
        pauseMenu.classList.remove('hidden');
        scoreEl.classList.add('hidden');
    } else {
        state.current = state.game;
        isPaused = false;
        pauseMenu.classList.add('hidden');
        scoreEl.classList.remove('hidden');
    }
}

// --- GAME LOOP ---
function animate() {
    // Clear screen
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.scale(scale, scale);
    
    // Draw logical graphics
    // Smooth day/night fade
    if (isNight) {
        if (nightFade < 1) nightFade = Math.min(1, nightFade + 0.02);
    } else {
        if (nightFade > 0) nightFade = Math.max(0, nightFade - 0.02);
    }
    
    // Draw sky background
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, logicalWidth, logicalHeight);
    
    if (nightFade > 0) {
        ctx.save();
        ctx.globalAlpha = nightFade;
        ctx.fillStyle = '#181a1b';
        ctx.fillRect(0, 0, logicalWidth, logicalHeight);
        ctx.restore();
    }
    
    // Draw Stars (at night)
    stars.forEach(s => {
        if (!isPaused && state.current !== state.over) s.update();
        s.draw();
    });
    
    // Draw Sun or Moon
    let skyObjectX = (logicalWidth - (gameTime * 0.04)) % (logicalWidth + 120) - 60;
    if (nightFade < 1) {
        // Draw Sun
        ctx.save();
        ctx.globalAlpha = 1 - nightFade;
        drawSprite(ctx, SUN, skyObjectX, 35, 2, { 'X': '#feca57' });
        ctx.restore();
    }
    if (nightFade > 0) {
        // Draw Moon
        ctx.save();
        ctx.globalAlpha = nightFade;
        drawSprite(ctx, MOON, skyObjectX, 35, 2, { 'X': '#e2e2e2' });
        ctx.restore();
    }
    
    // Spawn Clouds
    if (!isPaused && state.current !== state.over) {
        if (Math.random() < 0.005 && clouds.length < 4) {
            clouds.push(new Cloud());
        }
    }
    
    clouds.forEach((c, idx) => {
        if (!isPaused && state.current !== state.over) c.update();
        c.draw();
        if (c.x < -100) clouds.splice(idx, 1);
    });
    
    // Active Speed calculations (with admin slowmo multiplier)
    const activeSpeed = speed * trollSpeedMultiplier;
    
    // Draw Earth Block below Ground Y
    let earthColor = lerpColor('#f0f0f0', '#121314', nightFade);
    ctx.fillStyle = earthColor;
    ctx.fillRect(0, GROUND_Y, logicalWidth, logicalHeight - GROUND_Y);
    
    // Ground Line
    let groundColor = lerpColor('#d2d2d2', 'rgba(255,255,255,0.15)', nightFade);
    ctx.strokeStyle = groundColor;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(logicalWidth, GROUND_Y);
    ctx.stroke();
    
    // Ground Details (scrolling bumps)
    ctx.fillStyle = lerpColor('rgba(0,0,0,0.1)', 'rgba(255,255,255,0.08)', nightFade);
    for (let i = 0; i < logicalWidth + 80; i += 80) {
        const offset = (gameTime * activeSpeed) % 80;
        ctx.fillRect(i - offset + 15, GROUND_Y + 5, 12, 2);
        ctx.fillRect(i - offset + 45, GROUND_Y + 11, 6, 2);
    }
    
    // Logic updates
    if (state.current === state.game && !isPaused) {
        gameTime++;
        dayNightTick++;
        
        // Day/Night switch every 800 ticks
        if (dayNightTick >= 800) {
            dayNightTick = 0;
            isNight = !isNight;
            // update UI styles dynamically
            const container = document.getElementById('game-container');
            container.style.backgroundColor = isNight ? '#181a1b' : '#f7f7f7';
            scoreEl.style.color = isNight ? '#9cff7c' : '#333';
            document.querySelectorAll('.menu-box').forEach(el => {
                el.style.borderColor = isNight ? '#9cff7c' : '#feca57';
            });
        }
        
        // Score progression
        if (gameTime % 5 === 0) {
            score++;
            scoreEl.textContent = score;
            if (score > 0 && score % 100 === 0) {
                playSound('point');
                speed += 0.35;
            }
        }
        
        // Obstacles spawning
        if (gameTime - lastScoreTick > Math.max(55, 115 - speed * 4)) {
            if (Math.random() < 0.45) {
                obstacles.push(new Obstacle());
                lastScoreTick = gameTime;
            }
        }
        
        // Spawn dust particles
        if (!dino.isJumping && gameTime % 4 === 0) {
            let dustColor = lerpColor('#888', '#9cff7c', nightFade);
            particles.push(new Particle(dino.x + 4, GROUND_Y - 2, dustColor, -activeSpeed * 0.4 - Math.random() * 2, -Math.random() * 1.5, Math.random() * 3 + 1));
        }
    }
    
    // Draw & Update Obstacles
    obstacles.forEach((o, idx) => {
        if (!isPaused && state.current === state.game) {
            o.update(activeSpeed);
            if (checkCollision(dino, o)) {
                gameOver();
            }
        }
        o.draw();
        if (o.x < -100) obstacles.splice(idx, 1);
    });
    
    // Draw & Update Particles
    particles.forEach((p, idx) => {
        if (!isPaused && state.current === state.game) p.update();
        p.draw();
        if (p.alpha <= 0) particles.splice(idx, 1);
    });
    
    // Draw & Update Dino
    if (!isPaused && state.current === state.game) {
        dino.update();
    }
    
    // When getReady state, make dino stand on ground
    if (state.current === state.getReady) {
        dino.y = GROUND_Y - dino.height;
        dino.isJumping = false;
        dino.vy = 0;
    }
    dino.draw();
    
    ctx.restore();
    requestAnimationFrame(animate);
}

// --- CONTROLS LISTENERS ---
const handleAction = (e) => {
    if (e.target.closest('button') || e.target.closest('.portal-home-btn') || isPaused) return;
    
    resumeAudio();
    if (state.current === state.getReady) {
        startGame();
    } else if (state.current === state.game) {
        dino.jump();
    }
};

window.addEventListener('mousedown', handleAction);
window.addEventListener('touchstart', (e) => {
    if (!e.target.closest('button') && !e.target.closest('.portal-home-btn')) {
        e.preventDefault();
        handleAction(e);
    }
}, { passive: false });

// Keyboard Controls
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        resumeAudio();
        if (state.current === state.getReady) {
            startGame();
        } else if (state.current === state.over) {
            init();
            startGame();
        } else {
            dino.jump();
        }
    }
    if (e.code === 'ArrowDown') {
        e.preventDefault();
    }
    if (e.code === 'Escape' && state.current === state.game) {
        togglePause();
    }
});

// UI Overlay Button Bindings
startBtnMenu.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
pauseBtn.addEventListener('click', togglePause);
resumeBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePause(); });
restartPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); init(); startGame(); });
exitBtn.addEventListener('click', (e) => { e.stopPropagation(); showStartScreen(); });
restartBtn.addEventListener('click', (e) => { e.stopPropagation(); init(); startGame(); });
menuOverBtn.addEventListener('click', (e) => { e.stopPropagation(); showStartScreen(); });




// Start Cycle
showStartScreen();
animate();
</script>

    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;pointer-events:none;opacity:0;transition:opacity 1.5s';
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ov.style.opacity='1';});
    setTimeout(function(){ov.style.opacity='0';},2000);
    setTimeout(function(){ov.remove();},3600);
  }
  function trollCursor(){
    var style=document.createElement('style');style.id='troll-cursor-style';
    style.textContent='*{cursor:url("data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\'><text y=\'28\' font-size=\'28\'>💩</text></svg>") 16 16,auto !important}';
    document.head.appendChild(style);
    setTimeout(function(){style.remove();},6000);
  }
  function trollTypewriter(){
    var ov=document.getElementById('troll-typewriter');
    var words=['ACCESSING SYSTEM...','ROOT ACCESS GRANTED','DELETING SYSTEM32...','HACKING MAINFRAME...','BYPASSING FIREWALL...','UPLOADING VIRUS...','STEALING DATA...','ENCRYPTING FILES...','GAME OVER...','YOU HAVE BEEN PWNED'];
    ov.textContent='';ov.style.display='block';
    clearInterval(_typewriterInterval);
    var text='';
    _typewriterInterval=setInterval(function(){
      text+=words[Math.floor(Math.random()*words.length)]+'\n';
      if(text.length>600)text=text.slice(text.length-600);
      ov.textContent=text;
    },120);
    setTimeout(function(){clearInterval(_typewriterInterval);ov.style.display='none';ov.textContent='';},6000);
  }
  function trollEmojiRain(){
    var emojis=['😂','🤣','💀','🔥','👀','😱','🤡','👾','💩','🐛','🎃','👻','🦠','☠️','🤮','😈','👽','🛸','🌝','🍆','🌈','🦄','🐸'];
    for(var i=0;i<60;i++){(function(){
      var delay=Math.random()*2000;
      setTimeout(function(){
        var el=document.createElement('div');el.className='troll-float';
        el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left=Math.random()*100+'vw';el.style.top='-40px';
        el.style.fontSize=(16+Math.random()*24)+'px';
        el.style.animation='troll-fall '+(1.5+Math.random()*3)+'s ease-in forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},5500);
      },delay);
    })();}
  }
  function trollBigText(){
    var phrases=['ТЫ ВЗЛОМАН 💀','ВСЁ ПРОПАЛО 😱','УДАЛЯЮ ДАННЫЕ...','ПРОЩАЙ, ДРУГ 👋','СЕРВЕР ВЗЛОМАН','ВИРУС АКТИВИРОВАН ☠️'];
    var ov=document.getElementById('troll-bigtext');var sp=document.getElementById('troll-bigtext-word');
    ov.style.display='flex';var idx=0;sp.textContent=phrases[0];
    clearTimeout(_bigtextTimeout);
    function next(){idx++;if(idx>=phrases.length){ov.style.display='none';return;}sp.textContent=phrases[idx];_bigtextTimeout=setTimeout(next,900);}
    _bigtextTimeout=setTimeout(next,900);
    setTimeout(function(){ov.style.display='none';clearTimeout(_bigtextTimeout);},6000);
  }
  function trollUpsideText(){
    var style=document.createElement('style');style.id='troll-upside-style';
    style.textContent='p,h1,h2,h3,h4,span,a,button,label{transform:rotate(180deg) !important;display:inline-block !important}';
    document.head.appendChild(style);setTimeout(function(){style.remove();},5000);
  }
  function trollSlowMo(){
    trollSpeedMultiplier = 0.4; // slow motion gameplay
    document.documentElement.style.animationDuration='500%';document.documentElement.style.transitionDuration='500%';
    setTimeout(function(){
      trollSpeedMultiplier = 1.0;
      document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
    },6000);
  }
  function trollScaleCrazy(){
    clearInterval(_scaleCrazyInterval);
    _scaleCrazyInterval=setInterval(function(){
      var cards=document.querySelectorAll('.menu-box');if(!cards.length)return;
      var card=cards[Math.floor(Math.random()*cards.length)];
      card.style.transform='scale(1.3)';card.style.zIndex='200';card.style.transition='transform .1s';
      setTimeout(function(){card.style.transform='';card.style.zIndex='';},180);
    },200);
    setTimeout(function(){clearInterval(_scaleCrazyInterval);document.querySelectorAll('.menu-box').forEach(function(c){c.style.transform='';c.style.zIndex='';});},5000);
  }
  function trollColorInvert(){document.body.style.filter='invert(1)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},5000);}
  function trollReset(){
    trollSpeedMultiplier = 1.0;
    trollGravityMultiplier = 1.0;
    document.body.style.transform='';document.body.style.filter='';document.body.style.opacity='';
    document.getElementById('troll-matrix').style.display='none';clearInterval(_matrixInterval);
    document.getElementById('troll-virus').style.display='none';
    document.getElementById('troll-disco').style.display='none';clearTimeout(_discoTimeout);
    document.getElementById('troll-rainbow-overlay').style.display='none';
    document.getElementById('troll-glitch').style.display='none';document.getElementById('troll-glitch').innerHTML='';clearInterval(_glitchInterval);
    document.getElementById('troll-typewriter').style.display='none';clearInterval(_typewriterInterval);
    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();var map={'new_game':'bubblepop','flappy_bird':'flappy','tic_tac_toe':'tictactoe','pixel_art':'pixelart','cafe_sim':'cafesim'};var raw=(location.pathname.split('/').pop()||'index.html').toLowerCase().replace(/\.html$/,'');var gid=map[raw]||raw;if(data&&data.time>lastTrollTime&&(!data.target||data.target==='all'||data.target===gid)){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
</script>
