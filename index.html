<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Ball 3 — Веб-игра</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      user-select: none;
    }

    /* Верхняя панель */
    #ui-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 800px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #1a1a3e, #2d2d6b);
      border-radius: 14px 14px 0 0;
      border: 2px solid #3a3a7e;
      border-bottom: none;
    }

    #level-label {
      color: #f1c40f;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(241,196,15,0.6);
    }

    #restart-btn {
      background: linear-gradient(135deg, #e74c3c, #922b21);
      color: #fff;
      border: none;
      padding: 8px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(231,76,60,.45);
      letter-spacing: .5px;
    }
    #restart-btn:hover  { transform: scale(1.07); box-shadow: 0 6px 22px rgba(231,76,60,.65); }
    #restart-btn:active { transform: scale(.94); }

    #game-wrap {
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,.7);
      border: 2px solid #3a3a7e;
      border-top: none;
    }

    #hint {
      color: rgba(255,255,255,.35);
      font-size: 12px;
      margin-top: 10px;
      letter-spacing: .5px;
    }
  </style>
</head>
<body>

<div id="ui-bar">
  <span id="level-label">🎮 Уровень 1 / 3</span>
  <button id="restart-btn" onclick="restartCurrentLevel()">↺ Рестарт</button>
</div>
<div id="game-wrap"></div>
<p id="hint">← → / A D — движение &nbsp;|&nbsp; ↑ / W / Пробел — прыжок</p>

<!-- Phaser 3 через CDN -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
// =============================================================
//  ДАННЫЕ УРОВНЕЙ
//  platforms: [x_left, y_top, width, height]
//  spikes:    [x_left, y_top]  (каждый шип 20×20)
//  start/finish: центр объекта
// =============================================================
const LEVELS = [

  /* ---------- Уровень 1: Лёгкий (голубое небо) ---------- */
  {
    sky: 0x87CEEB,
    start:  { x: 60,  y: 505 },
    finish: { x: 720, y: 200 },
    platforms: [
      [   0, 540, 260, 20 ],   // стартовый участок
      [ 320, 470, 120, 20 ],   // ступень 1
      [ 490, 400, 120, 20 ],   // ступень 2
      [ 650, 325, 120, 20 ],   // ступень 3
      [ 530, 230, 230, 20 ],   // верхняя площадка (финиш)
      [   0, 580, 800, 20 ],   // нижний пол
    ],
    spikes: [
      [270, 560], [292, 560],
      [445, 560], [467, 560],
      [615, 560], [637, 560],
    ],
  },

  /* ---------- Уровень 2: Средний (закат) ---------- */
  {
    sky: 0xE07B39,
    start:  { x: 50,  y: 500 },
    finish: { x: 738, y: 145 },
    platforms: [
      [   0, 540, 175, 20 ],
      [ 235, 470,  90, 20 ],
      [ 385, 400,  90, 20 ],
      [ 265, 315,  90, 20 ],
      [ 415, 240,  90, 20 ],
      [ 575, 310,  90, 20 ],
      [ 630, 185, 170, 20 ],
      [   0, 580, 800, 20 ],
    ],
    spikes: [
      [180, 560], [202, 560], [224, 560],
      [348, 560], [370, 560], [392, 560],
      [515, 560], [537, 560],
      /* шипы на платформе */
      [392, 380], [414, 380],
    ],
  },

  /* ---------- Уровень 3: Сложный (ночь) ---------- */
  {
    sky: 0x12122a,
    start:  { x: 40,  y: 505 },
    finish: { x: 715, y: 105 },
    platforms: [
      [   0, 545, 130, 20 ],
      [ 185, 478,  75, 20 ],
      [ 320, 410,  75, 20 ],
      [ 200, 338,  75, 20 ],
      [ 335, 265,  75, 20 ],
      [ 475, 335,  75, 20 ],
      [ 475, 200,  75, 20 ],
      [ 605, 265,  75, 20 ],
      [ 610, 140, 190, 20 ],
      [   0, 580, 800, 20 ],
    ],
    spikes: [
      [135, 560], [157, 560], [179, 560],
      [275, 560], [297, 560],
      [438, 560], [460, 560], [482, 560],
      [562, 560], [584, 560],
      /* шипы на платформах */
      [325, 390], [347, 390],
      [340, 245], [362, 245],
    ],
  },

];

// =============================================================
//  ГЛОБАЛЬНОЕ СОСТОЯНИЕ
// =============================================================
let currentLevel = 0;
let game         = null;

// =============================================================
//  ИГРОВАЯ СЦЕНА
// =============================================================
class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'GameScene' }); }

  // -----------------------------------------------------------
  //  Программное создание текстур (только если ещё нет в кэше)
  // -----------------------------------------------------------
  buildTextures() {
    const g = this.make.graphics({ add: false });

    /* Красный шар */
    if (!this.textures.exists('ball')) {
      g.clear();
      g.fillStyle(0x990000);
      g.fillCircle(21, 21, 19);         // тень
      g.fillStyle(0xcc0000);
      g.fillCircle(20, 20, 18);         // основной цвет
      g.fillStyle(0xff5555);
      g.fillCircle(12, 11, 7);          // блик
      g.fillStyle(0xffffff, 0.7);
      g.fillCircle(10, 9, 3);           // яркий блик
      g.generateTexture('ball', 40, 40);
    }

    /* Плитка платформы 32×20 */
    if (!this.textures.exists('plat')) {
      g.clear();
      g.fillStyle(0x27ae60);
      g.fillRect(0, 0, 32, 20);
      g.fillStyle(0x2ecc71);
      g.fillRect(0, 0, 32, 5);          // верхний светлый слой
      g.fillStyle(0x1a7a44);
      g.fillRect(0, 15, 32, 5);         // нижний тёмный слой
      g.fillStyle(0x1a6e3c);
      g.fillRect(31, 0, 1, 20);         // правая граница
      g.generateTexture('plat', 32, 20);
    }

    /* Тёмная плитка для ночного уровня 32×20 */
    if (!this.textures.exists('plat_dark')) {
      g.clear();
      g.fillStyle(0x555577);
      g.fillRect(0, 0, 32, 20);
      g.fillStyle(0x7777aa);
      g.fillRect(0, 0, 32, 5);
      g.fillStyle(0x333355);
      g.fillRect(0, 15, 32, 5);
      g.fillStyle(0x222244);
      g.fillRect(31, 0, 1, 20);
      g.generateTexture('plat_dark', 32, 20);
    }

    /* Шип 20×20 */
    if (!this.textures.exists('spike')) {
      g.clear();
      g.fillStyle(0xdd1111);
      g.beginPath();
      g.moveTo(10, 0);
      g.lineTo(20, 20);
      g.lineTo(0, 20);
      g.closePath();
      g.fillPath();
      g.fillStyle(0xff7777, 0.6);
      g.beginPath();
      g.moveTo(10, 3);
      g.lineTo(16, 17);
      g.lineTo(10, 17);
      g.closePath();
      g.fillPath();
      g.generateTexture('spike', 20, 20);
    }

    /* Финишная звезда 44×44 */
    if (!this.textures.exists('finish')) {
      g.clear();
      g.fillStyle(0xf39c12, 0.25);
      g.fillCircle(22, 22, 22);         // ореол
      g.fillStyle(0xf1c40f);
      g.fillCircle(22, 22, 16);         // звезда
      g.fillStyle(0xffeaa7);
      g.fillCircle(14, 13, 6);          // блик
      g.fillStyle(0xffffff, 0.9);
      g.fillCircle(12, 11, 2);
      g.generateTexture('finish', 44, 44);
    }

    g.destroy();
  }

  // -----------------------------------------------------------
  //  Создание сцены
  // -----------------------------------------------------------
  create() {
    const lvl = LEVELS[currentLevel];

    /* Фон */
    this.cameras.main.setBackgroundColor(lvl.sky);

    /* Текстуры */
    this.buildTextures();

    /* Флаги состояния */
    this.isDead    = false;
    this.levelDone = false;

    /* Декор: облака / звёзды */
    this.addDecor(lvl);

    /* ---- ПЛАТФОРМЫ ---- */
    const platKey = currentLevel === 2 ? 'plat_dark' : 'plat';
    this.platforms = this.physics.add.staticGroup();

    lvl.platforms.forEach(([px, py, pw /*, ph ignored — tile is 20px tall */]) => {
      const cols = Math.ceil(pw / 32);
      for (let c = 0; c < cols; c++) {
        // центр тайла: px + c*32 + 16, py + 10
        const t = this.platforms.create(px + c * 32 + 16, py + 10, platKey);
        t.refreshBody();
      }
    });

    /* ---- ШИПЫ ---- */
    this.spikes = this.physics.add.staticGroup();

    lvl.spikes.forEach(([sx, sy]) => {
      const sp = this.spikes.create(sx + 10, sy + 10, 'spike');
      sp.body.setSize(12, 12).setOffset(4, 4); // урезанный хитбокс
      sp.refreshBody();
    });

    /* ---- ФИНИШ ---- */
    this.finishStar = this.physics.add.staticImage(lvl.finish.x, lvl.finish.y, 'finish');
    this.finishStar.body.setSize(26, 26).setOffset(9, 9);
    this.finishStar.refreshBody();

    // Пульсирующая анимация финишной звезды
    this.tweens.add({
      targets:  this.finishStar,
      scale:    1.3,
      yoyo:     true,
      repeat:   -1,
      duration: 550,
      ease:     'Sine.easeInOut',
    });

    /* ---- ИГРОК (шар) ---- */
    this.ball = this.physics.add.sprite(lvl.start.x, lvl.start.y, 'ball');
    this.ball.setCollideWorldBounds(true);
    this.ball.setBounce(0.08);
    this.ball.body.setCircle(18, 2, 2); // круглый хитбокс

    /* ---- ФИЗИКА/КОЛЛИЗИИ ---- */
    this.physics.add.collider(this.ball, this.platforms);

    this.physics.add.overlap(
      this.ball, this.finishStar,
      this.reachFinish, null, this
    );

    this.physics.add.overlap(
      this.ball, this.spikes,
      this.hitSpike, null, this
    );

    /* ---- ВВОД ---- */
    this.keys = this.input.keyboard.addKeys({
      left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:    Phaser.Input.Keyboard.KeyCodes.UP,
      a:     Phaser.Input.Keyboard.KeyCodes.A,
      d:     Phaser.Input.Keyboard.KeyCodes.D,
      w:     Phaser.Input.Keyboard.KeyCodes.W,
      space: Phaser.Input.Keyboard.KeyCodes.SPACE,
    });

    /* ---- UI ---- */
    this.refreshHtml();

    // Подсказка на первом уровне
    if (currentLevel === 0) {
      const hint = this.add.text(400, 18, '← → двигайся  |  ↑ прыгай  |  ⭐ — финиш', {
        fontSize: '14px', color: '#ffffffaa',
      }).setOrigin(0.5, 0).setDepth(5);
      this.time.delayedCall(4000, () => hint.destroy());
    }
  }

  // -----------------------------------------------------------
  //  Декор: облака (уровни 1-2) или звёзды (уровень 3)
  // -----------------------------------------------------------
  addDecor(lvl) {
    if (currentLevel < 2) {
      // Облака
      const clouds = [[100,55],[310,35],[560,65],[720,28]];
      clouds.forEach(([cx,cy]) => {
        const g = this.add.graphics();
        g.fillStyle(0xffffff, 0.55);
        g.fillEllipse(cx,     cy,    72, 36);
        g.fillEllipse(cx+24,  cy-12, 52, 30);
        g.fillEllipse(cx-22,  cy-8,  44, 26);
      });
    } else {
      // Звёзды ночного неба
      const g = this.add.graphics();
      g.fillStyle(0xffffff, 0.8);
      for (let i = 0; i < 60; i++) {
        const sx = Phaser.Math.Between(0, 800);
        const sy = Phaser.Math.Between(0, 300);
        const sr = Phaser.Math.FloatBetween(0.5, 2);
        g.fillCircle(sx, sy, sr);
      }
      // Луна
      g.fillStyle(0xf5f5dc, 0.95);
      g.fillCircle(720, 55, 30);
      g.fillStyle(0x12122a);
      g.fillCircle(730, 50, 24); // вырез полумесяца
    }
  }

  // -----------------------------------------------------------
  //  Главный игровой цикл
  // -----------------------------------------------------------
  update() {
    if (this.isDead || this.levelDone) return;

    const onGround = this.ball.body.blocked.down;
    const goLeft   = this.keys.left.isDown  || this.keys.a.isDown;
    const goRight  = this.keys.right.isDown || this.keys.d.isDown;
    const doJump   = Phaser.Input.Keyboard.JustDown(this.keys.up)
                  || Phaser.Input.Keyboard.JustDown(this.keys.w)
                  || Phaser.Input.Keyboard.JustDown(this.keys.space);

    /* Горизонтальное движение с плавным торможением */
    if (goLeft)       this.ball.setVelocityX(-230);
    else if (goRight) this.ball.setVelocityX( 230);
    else              this.ball.setVelocityX(this.ball.body.velocity.x * 0.75);

    /* Прыжок */
    if (doJump && onGround) this.ball.setVelocityY(-530);

    /* Вращение шара при движении */
    this.ball.angle += this.ball.body.velocity.x * 0.011;
  }

  // -----------------------------------------------------------
  //  Достижение финиша
  // -----------------------------------------------------------
  reachFinish() {
    if (this.levelDone) return;
    this.levelDone = true;

    this.cameras.main.flash(400, 255, 240, 80);

    this.time.delayedCall(520, () => {
      currentLevel++;
      if (currentLevel >= LEVELS.length) {
        this.showVictory();
      } else {
        this.scene.restart();
      }
    });
  }

  // -----------------------------------------------------------
  //  Касание шипа → мгновенный рестарт
  // -----------------------------------------------------------
  hitSpike() {
    if (this.isDead || this.levelDone) return;
    this.isDead = true;

    this.cameras.main.shake(300, 0.018);
    this.cameras.main.flash(180, 255, 0, 0, false);

    // Эффект «разлёта» шара
    this.ball.setVelocityY(-380);
    this.ball.setVelocityX(Phaser.Math.Between(-180, 180));

    this.time.delayedCall(430, () => this.scene.restart());
  }

  // -----------------------------------------------------------
  //  Экран победы (после 3-го уровня)
  // -----------------------------------------------------------
  showVictory() {
    // Затемнение
    this.add.rectangle(400, 300, 800, 600, 0x000000, 0.78).setDepth(10);

    // Трофей
    this.add.text(400, 175, '🏆', { fontSize: '72px' })
      .setOrigin(0.5).setDepth(11);

    // Заголовок
    this.add.text(400, 268, 'ПОБЕДА!', {
      fontSize: '58px', color: '#f1c40f', fontStyle: 'bold',
      stroke: '#000', strokeThickness: 8,
    }).setOrigin(0.5).setDepth(11);

    // Подзаголовок
    this.add.text(400, 345, 'Все 3 уровня пройдены!', {
      fontSize: '24px', color: '#ecf0f1',
    }).setOrigin(0.5).setDepth(11);

    // Кнопка «Начать заново»
    const btn = this.add.text(400, 425, '[ Начать заново ]', {
      fontSize: '28px', color: '#e74c3c', fontStyle: 'bold',
    }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });

    btn.on('pointerover',  () => btn.setColor('#ff8888'));
    btn.on('pointerout',   () => btn.setColor('#e74c3c'));
    btn.on('pointerdown',  () => { currentLevel = 0; this.scene.restart(); });

    // Обновляем HTML-счётчик
    this.refreshHtml();
  }

  // -----------------------------------------------------------
  //  Обновление HTML-метки уровня
  // -----------------------------------------------------------
  refreshHtml() {
    const el = document.getElementById('level-label');
    const lvNum = Math.min(currentLevel + 1, LEVELS.length);
    if (el) el.textContent = `🎮 Уровень ${lvNum} / ${LEVELS.length}`;
  }
}

// =============================================================
//  КОНФИГУРАЦИЯ И ЗАПУСК PHASER
// =============================================================
const config = {
  type:   Phaser.AUTO,
  width:  800,
  height: 600,
  parent: 'game-wrap',
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 620 },
      debug: false,
    },
  },
  scene: GameScene,
};

game = new Phaser.Game(config);

// =============================================================
//  Глобальная функция HTML-кнопки «Рестарт»
// =============================================================
function restartCurrentLevel() {
  const sc = game.scene.getScene('GameScene');
  if (sc) {
    sc.isDead    = false;
    sc.levelDone = false;
    sc.scene.restart();
  }
}
</script>
</body>
</html>
