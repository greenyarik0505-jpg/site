<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Игровой Портал</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow-x:hidden;font-family:'Nunito',sans-serif;background:#0f0c29;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);min-height:100vh}

/* ЧАСТИЦЫ ФОН */
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}

/* ХЕДЕР */
.header{position:relative;z-index:10;text-align:center;padding:30px 15px 10px}
.header h1{font-size:clamp(28px,7vw,48px);font-weight:900;background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#ff9ff3);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;animation:hueShift 4s linear infinite}
@keyframes hueShift{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
.header p{color:#888;font-size:14px;margin-top:4px}

/* СЕТКА ИГР */
.games-grid{position:relative;z-index:10;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:20px 16px;max-width:700px;margin:0 auto}
.game-card{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:20px 14px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;position:relative;overflow:hidden}
.game-card:hover,.game-card:active{transform:translateY(-4px) scale(1.02);background:rgba(255,255,255,0.13);box-shadow:0 8px 30px rgba(0,0,0,.4)}
.game-card .icon{font-size:48px;display:block;margin-bottom:10px;transition:transform .3s}
.game-card:hover .icon{transform:scale(1.15) rotate(-5deg)}
.game-card h3{font-size:16px;margin-bottom:4px;color:#fff}
.game-card p{font-size:11px;color:#999;line-height:1.3}
.game-card .badge{position:absolute;top:8px;right:8px;background:#ff6b6b;color:#fff;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700}
.game-card.custom-game .badge{background:#48dbfb}

/* СЕКРЕТНАЯ КНОПКА АДМИНА */
.admin-trigger{position:fixed;bottom:8px;right:8px;width:30px;height:30px;opacity:0.03;z-index:50;cursor:default;border-radius:50%}

/* ОВЕРЛЕЙ АДМИН */
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;backdrop-filter:blur(8px)}
.overlay.show{display:flex}
.modal{background:#1a1a2e;border:1px solid #333;border-radius:20px;padding:24px;width:92%;max-width:440px;max-height:85vh;overflow-y:auto;position:relative}
.modal h2{font-size:22px;margin-bottom:16px;color:#feca57;text-align:center}
.modal label{display:block;font-size:13px;color:#aaa;margin:10px 0 4px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #444;background:#16213e;color:#fff;font-size:14px;font-family:inherit}
.modal textarea{min-height:80px;resize:vertical}
.modal .btn{display:block;width:100%;padding:12px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit;transition:transform .1s}
.modal .btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff}
.btn-danger{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff}
.btn-troll{background:linear-gradient(135deg,#feca57,#ff9ff3);color:#000}
.btn-secondary{background:#333;color:#fff}
.btn-sm{display:inline-block;width:auto;padding:6px 14px;font-size:12px;margin:4px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:700;color:#fff}
.close-btn{position:absolute;top:12px;right:14px;background:none;border:none;color:#888;font-size:22px;cursor:pointer}

/* СПИСОК ИГР В АДМИНКЕ */
.admin-game-list{margin:10px 0}
.admin-game-item{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.05);padding:8px 12px;border-radius:10px;margin:6px 0}
.admin-game-item span{font-size:14px}

/* ТРОЛЛЬ СЕКЦИЯ */
.troll-section{border-top:1px solid #333;margin-top:16px;padding-top:14px}
.troll-section h3{color:#ff9ff3;font-size:16px;margin-bottom:10px;text-align:center}
.troll-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ЭФФЕКТЫ */
.flip-effect{animation:flipIt .5s forwards}
@keyframes flipIt{to{transform:rotate(180deg)}}
.shake-effect{animation:shakeIt .5s}
@keyframes shakeIt{0%,100%{transform:translateX(0)}25%{transform:translateX(-20px)}75%{transform:translateX(20px)}}

/* МАТРИЦА */
#matrix-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;pointer-events:none;display:none}

/* ФЕЙК ВИРУС */
#fake-virus{display:none;position:fixed;top:0;left:0;width:100%;height:100%;z-index:1000;background:#000;justify-content:center;align-items:center;flex-direction:column;cursor:pointer}
#fake-virus h1{color:#0f0;font-size:clamp(20px,5vw,36px);text-align:center;font-family:monospace;animation:blink .5s infinite}
#fake-virus p{color:#0f0;font-size:14px;margin-top:10px;font-family:monospace}
@keyframes blink{50%{opacity:.3}}

/* ДИСКОТЕКА */
.disco-mode{animation:disco .2s infinite}
@keyframes disco{0%{background:red}25%{background:blue}50%{background:green}75%{background:yellow}100%{background:purple}}

/* КОНФЕТТИ */
.confetti-piece{position:fixed;width:10px;height:10px;z-index:998;pointer-events:none;animation:confettiFall 3s ease-out forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

/* УБЕГАЮЩИЕ КАРТОЧКИ */
.running-away{transition:transform .3s ease-out !important}

/* FOOTER */
.footer{position:relative;z-index:10;text-align:center;padding:20px;color:#555;font-size:11px}
</style>
</head>
<body>

<canvas id="particles"></canvas>
<canvas id="matrix-canvas"></canvas>

<div id="fake-virus" onclick="this.style.display='none'">
<h1>⚠️ ВНИМАНИЕ ⚠️<br>ОБНАРУЖЕН ВИРУС!!!<br>ВСЕ ДАННЫЕ УДАЛЕНЫ!</h1>
<p>(нажми чтобы закрыть 😂)</p>
</div>

<div class="header">
<h1>🎮 ИГРОВОЙ ПОРТАЛ</h1>
<p>Выбери игру и играй!</p>
</div>

<div class="games-grid" id="gamesGrid"></div>

<div class="footer">
<span id="joke"></span><br>
Игровой Портал • Open Source • 2025
</div>

<div class="admin-trigger" id="adminTrigger"></div>

<!-- ПАРОЛЬ -->
<div class="overlay" id="passOverlay">
<div class="modal">
<button class="close-btn" onclick="closeAll()">&times;</button>
<h2>🔐 Вход</h2>
<div id="passSetup" style="display:none">
<label>Придумай пароль админа:</label>
<input type="password" id="newPass" placeholder="Пароль...">
<input type="password" id="newPass2" placeholder="Повтори пароль..." style="margin-top:8px">
<button class="btn btn-primary" onclick="setupPassword()">Сохранить</button>
</div>
<div id="passLogin" style="display:none">
<label>Пароль:</label>
<input type="password" id="loginPass" placeholder="Пароль...">
<button class="btn btn-primary" onclick="checkPassword()">Войти</button>
<p id="passError" style="color:#ff6b6b;font-size:12px;margin-top:8px;display:none">Неверный пароль!</p>
</div>
</div>
</div>

<!-- АДМИН ПАНЕЛЬ -->
<div class="overlay" id="adminOverlay">
<div class="modal">
<button class="close-btn" onclick="closeAll()">&times;</button>
<h2>🛠 Админ-панель</h2>

<div id="adminMain">
<button class="btn btn-primary" onclick="showAddGame()">➕ Добавить игру</button>
<button class="btn btn-secondary" onclick="showManageGames()">📋 Управление играми</button>
<button class="btn btn-secondary" onclick="resetPassword()">🔑 Сменить пароль</button>

<div class="troll-section">
<h3>🎭 Тролль-панель</h3>
<div class="troll-grid">
<button class="btn-sm btn-troll" onclick="trollFlip()">🙃 Перевернуть</button>
<button class="btn-sm btn-troll" onclick="trollMatrix()">💚 Матрица</button>
<button class="btn-sm btn-troll" onclick="trollDisco()">🪩 Дискотека</button>
<button class="btn-sm btn-troll" onclick="trollVirus()">☠️ Фейк-вирус</button>
<button class="btn-sm btn-troll" onclick="trollShake()">📳 Землетрясение</button>
<button class="btn-sm btn-troll" onclick="trollConfetti()">🎊 Конфетти</button>
<button class="btn-sm btn-troll" onclick="trollRunAway()">🏃 Убегающие карты</button>
<button class="btn-sm btn-troll" onclick="trollRainbow()">🌈 Радуга текст</button>
<button class="btn-sm btn-troll" onclick="trollGravity()">⬇️ Гравитация</button>
<button class="btn-sm btn-troll" onclick="trollReset()">🔄 Сброс эффектов</button>
</div>
</div>
</div>

<!-- ДОБАВИТЬ ИГРУ -->
<div id="addGameForm" style="display:none">
<button class="btn-sm btn-secondary" onclick="showAdminMain()" style="margin-bottom:10px">← Назад</button>
<h3 style="margin-bottom:10px">Добавить игру</h3>
<label>Иконка (эмоджи):</label>
<input type="text" id="addIcon" placeholder="🎮" maxlength="4">
<label>Название:</label>
<input type="text" id="addName" placeholder="Моя Игра">
<label>Описание:</label>
<input type="text" id="addDesc" placeholder="Крутая игра!">
<label>Тип:</label>
<select id="addType">
<option value="link">Ссылка на файл (URL)</option>
<option value="code">HTML код (встроенная)</option>
</select>
<div id="addLinkDiv">
<label>URL файла (.html):</label>
<input type="text" id="addUrl" placeholder="my_game.html">
</div>
<div id="addCodeDiv" style="display:none">
<label>HTML код игры:</label>
<textarea id="addCode" placeholder="<!DOCTYPE html>..." rows="6"></textarea>
</div>
<label>Бейдж (необязательно):</label>
<input type="text" id="addBadge" placeholder="NEW" maxlength="12">
<button class="btn btn-primary" onclick="saveNewGame()">💾 Сохранить</button>
</div>

<!-- УПРАВЛЕНИЕ ИГРАМИ -->
<div id="manageGames" style="display:none">
<button class="btn-sm btn-secondary" onclick="showAdminMain()" style="margin-bottom:10px">← Назад</button>
<h3 style="margin-bottom:10px">Управление играми</h3>
<div id="adminGameList"></div>
</div>

</div>
</div>

<script>
// =======================================================
//  БАЗОВЫЕ ИГРЫ (встроенные, нельзя удалить)
// =======================================================
const DEFAULT_GAMES = [
  { id:'redball', icon:'🔴', name:'Red Ball 3', desc:'Платформер с шариком', url:'red_ball.html', badge:'ХИТ', type:'link', builtin:true },
  { id:'sandbox', icon:'🎨', name:'Песочница', desc:'Физика, рисование, объекты', url:'sandbox.html', badge:'NEW', type:'link', builtin:true },
  { id:'bubblepop', icon:'🫧', name:'Шарики POP', desc:'Стреляй и лопай шарики!', url:'New_game.html', badge:'', type:'link', builtin:true },
  { id:'flappy', icon:'🐤', name:'Flappy Bird', desc:'Летай между трубами!', url:'Flappy_Bird.html', badge:'', type:'link', builtin:true },
];

// =======================================================
//  ХРАНИЛИЩЕ
// =======================================================
function getCustomGames() {
  try { return JSON.parse(localStorage.getItem('portal_custom_games')) || []; } catch(e) { return []; }
}
function saveCustomGames(arr) { localStorage.setItem('portal_custom_games', JSON.stringify(arr)); }
function getAllGames() { return [...DEFAULT_GAMES, ...getCustomGames()]; }

// =======================================================
//  РЕНДЕР КАРТОЧЕК
// =======================================================
function renderGames() {
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';
  getAllGames().forEach((g, i) => {
    const card = document.createElement('div');
    card.className = 'game-card' + (g.builtin ? '' : ' custom-game');
    card.innerHTML = `
      <span class="icon">${g.icon || '🎮'}</span>
      <h3>${g.name}</h3>
      <p>${g.desc || ''}</p>
      ${g.badge ? `<div class="badge">${g.badge}</div>` : ''}
    `;
    card.addEventListener('click', () => openGame(g));
    grid.appendChild(card);
  });
}

function openGame(g) {
  if (g.type === 'code' && g.code) {
    const w = window.open('', '_blank');
    w.document.write(g.code);
    w.document.close();
  } else if (g.url) {
    window.location.href = g.url;
  }
}

// =======================================================
//  ПАРОЛЬ (SHA-256 хеш в localStorage)
// =======================================================
async function hashPass(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

let adminUnlocked = false;

// Секретная кнопка: 5 быстрых тапов
let tapCount = 0, tapTimer = null;
document.getElementById('adminTrigger').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => tapCount = 0, 1500);
  if (tapCount >= 5) {
    tapCount = 0;
    openAdminAuth();
  }
});

function openAdminAuth() {
  const hash = localStorage.getItem('portal_admin_hash');
  document.getElementById('passOverlay').classList.add('show');
  if (!hash) {
    document.getElementById('passSetup').style.display = 'block';
    document.getElementById('passLogin').style.display = 'none';
  } else {
    document.getElementById('passSetup').style.display = 'none';
    document.getElementById('passLogin').style.display = 'block';
    document.getElementById('passError').style.display = 'none';
    document.getElementById('loginPass').value = '';
  }
}

async function setupPassword() {
  const p1 = document.getElementById('newPass').value;
  const p2 = document.getElementById('newPass2').value;
  if (!p1 || p1.length < 3) return alert('Минимум 3 символа!');
  if (p1 !== p2) return alert('Пароли не совпадают!');
  localStorage.setItem('portal_admin_hash', await hashPass(p1));
  closeAll();
  adminUnlocked = true;
  openAdmin();
}

async function checkPassword() {
  const p = document.getElementById('loginPass').value;
  const hash = await hashPass(p);
  if (hash === localStorage.getItem('portal_admin_hash')) {
    document.getElementById('passError').style.display = 'none';
    closeAll();
    adminUnlocked = true;
    openAdmin();
  } else {
    document.getElementById('passError').style.display = 'block';
  }
}

function resetPassword() {
  if (confirm('Сменить пароль?')) {
    localStorage.removeItem('portal_admin_hash');
    closeAll();
    adminUnlocked = false;
    openAdminAuth();
  }
}

// =======================================================
//  АДМИН ПАНЕЛЬ
// =======================================================
function openAdmin() {
  if (!adminUnlocked) return;
  document.getElementById('adminOverlay').classList.add('show');
  showAdminMain();
}

function closeAll() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
}

function showAdminMain() {
  document.getElementById('adminMain').style.display = 'block';
  document.getElementById('addGameForm').style.display = 'none';
  document.getElementById('manageGames').style.display = 'none';
}

// --- ДОБАВИТЬ ИГРУ ---
function showAddGame() {
  document.getElementById('adminMain').style.display = 'none';
  document.getElementById('addGameForm').style.display = 'block';
  document.getElementById('addIcon').value = '🎮';
  document.getElementById('addName').value = '';
  document.getElementById('addDesc').value = '';
  document.getElementById('addUrl').value = '';
  document.getElementById('addCode').value = '';
  document.getElementById('addBadge').value = 'NEW';
}

document.getElementById('addType').addEventListener('change', function() {
  document.getElementById('addLinkDiv').style.display = this.value === 'link' ? 'block' : 'none';
  document.getElementById('addCodeDiv').style.display = this.value === 'code' ? 'block' : 'none';
});

function saveNewGame() {
  const name = document.getElementById('addName').value.trim();
  if (!name) return alert('Введи название!');
  const game = {
    id: 'custom_' + Date.now(),
    icon: document.getElementById('addIcon').value || '🎮',
    name,
    desc: document.getElementById('addDesc').value,
    type: document.getElementById('addType').value,
    url: document.getElementById('addUrl').value,
    code: document.getElementById('addCode').value,
    badge: document.getElementById('addBadge').value,
    builtin: false,
  };
  const arr = getCustomGames();
  arr.push(game);
  saveCustomGames(arr);
  renderGames();
  showAdminMain();
}

// --- УПРАВЛЕНИЕ ИГРАМИ ---
function showManageGames() {
  document.getElementById('adminMain').style.display = 'none';
  document.getElementById('manageGames').style.display = 'block';
  const list = document.getElementById('adminGameList');
  list.innerHTML = '';
  const customs = getCustomGames();
  if (customs.length === 0) {
    list.innerHTML = '<p style="color:#888;font-size:13px;text-align:center">Нет пользовательских игр</p>';
    return;
  }
  customs.forEach((g, i) => {
    const item = document.createElement('div');
    item.className = 'admin-game-item';
    item.innerHTML = `<span>${g.icon} ${g.name}</span><div><button class="btn-sm btn-danger" onclick="deleteGame(${i})">🗑</button></div>`;
    list.appendChild(item);
  });
}

function deleteGame(index) {
  if (!confirm('Удалить эту игру?')) return;
  const arr = getCustomGames();
  arr.splice(index, 1);
  saveCustomGames(arr);
  renderGames();
  showManageGames();
}

// =======================================================
//  ТРОЛЛЬ ФИЧИ 🎭
// =======================================================
let matrixInterval = null;
let discoTimeout = null;
let runAwayActive = false;

function trollFlip() {
  closeAll();
  document.body.style.transform = 'rotate(180deg)';
  document.body.style.transition = 'transform 1s';
  setTimeout(() => { document.body.style.transform = ''; }, 5000);
}

function trollMatrix() {
  closeAll();
  const mc = document.getElementById('matrix-canvas');
  mc.style.display = 'block';
  const mctx = mc.getContext('2d');
  mc.width = window.innerWidth;
  mc.height = window.innerHeight;
  const cols = Math.floor(mc.width / 14);
  const drops = Array(cols).fill(1);
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
  clearInterval(matrixInterval);
  matrixInterval = setInterval(() => {
    mctx.fillStyle = 'rgba(0,0,0,0.05)';
    mctx.fillRect(0, 0, mc.width, mc.height);
    mctx.fillStyle = '#0f0';
    mctx.font = '14px monospace';
    for (let i = 0; i < drops.length; i++) {
      const ch = chars[Math.floor(Math.random() * chars.length)];
      mctx.fillText(ch, i * 14, drops[i] * 14);
      if (drops[i] * 14 > mc.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }, 35);
  setTimeout(() => { clearInterval(matrixInterval); mc.style.display = 'none'; }, 8000);
}

function trollDisco() {
  closeAll();
  document.body.classList.add('disco-mode');
  clearTimeout(discoTimeout);
  discoTimeout = setTimeout(() => document.body.classList.remove('disco-mode'), 5000);
}

function trollVirus() {
  closeAll();
  document.getElementById('fake-virus').style.display = 'flex';
}

function trollShake() {
  closeAll();
  document.body.classList.add('shake-effect');
  let count = 0;
  const int = setInterval(() => {
    document.body.style.transform = `translate(${(Math.random()-.5)*30}px, ${(Math.random()-.5)*20}px)`;
    count++;
    if (count > 40) { clearInterval(int); document.body.style.transform = ''; document.body.classList.remove('shake-effect'); }
  }, 50);
}

function trollConfetti() {
  closeAll();
  const colors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#6c5ce7','#00b894','#fd79a8'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + '%';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    c.style.animationDelay = Math.random() * 2 + 's';
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

function trollRunAway() {
  closeAll();
  runAwayActive = !runAwayActive;
  if (runAwayActive) {
    document.addEventListener('pointermove', runAwayHandler);
  } else {
    document.removeEventListener('pointermove', runAwayHandler);
    document.querySelectorAll('.game-card').forEach(c => c.style.transform = '');
  }
}

function runAwayHandler(e) {
  document.querySelectorAll('.game-card').forEach(card => {
    const r = card.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const dx = cx - e.clientX;
    const dy = cy - e.clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      const force = (200 - dist) / 2;
      const ax = (dx / dist) * force;
      const ay = (dy / dist) * force;
      card.style.transform = `translate(${ax}px, ${ay}px)`;
    } else {
      card.style.transform = '';
    }
  });
}

function trollRainbow() {
  closeAll();
  const cards = document.querySelectorAll('.game-card h3');
  const colors = ['#ff0000','#ff8800','#ffff00','#00ff00','#0088ff','#8800ff','#ff00ff'];
  let idx = 0;
  const int = setInterval(() => {
    cards.forEach((h, i) => h.style.color = colors[(idx + i) % colors.length]);
    idx++;
  }, 200);
  setTimeout(() => { clearInterval(int); cards.forEach(h => h.style.color = ''); }, 6000);
}

function trollGravity() {
  closeAll();
  const cards = document.querySelectorAll('.game-card');
  cards.forEach((c, i) => {
    c.style.transition = 'transform 1s ease-in';
    setTimeout(() => {
      c.style.transform = `translateY(${window.innerHeight}px) rotate(${(Math.random()-.5)*90}deg)`;
    }, i * 100);
  });
  setTimeout(() => {
    cards.forEach(c => { c.style.transition = 'transform .5s ease-out'; c.style.transform = ''; });
  }, 4000);
}

function trollReset() {
  closeAll();
  document.body.style.transform = '';
  document.body.classList.remove('disco-mode', 'shake-effect');
  document.getElementById('matrix-canvas').style.display = 'none';
  document.getElementById('fake-virus').style.display = 'none';
  clearInterval(matrixInterval);
  clearTimeout(discoTimeout);
  runAwayActive = false;
  document.removeEventListener('pointermove', runAwayHandler);
  document.querySelectorAll('.game-card').forEach(c => { c.style.transform = ''; c.style.transition = ''; });
  document.querySelectorAll('.game-card h3').forEach(h => h.style.color = '');
}

(function(){
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let dots = [];
  function resize() { c.width = window.innerWidth; c.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  for (let i = 0; i < 50; i++) dots.push({ x:Math.random()*c.width, y:Math.random()*c.height, r:Math.random()*2+.5, dx:(Math.random()-.5)*.5, dy:(Math.random()-.5)*.5, a:Math.random()*.4+.1 });
  function draw() {
    ctx.clearRect(0, 0, c.width, c.height);
    dots.forEach(d => {
      d.x += d.dx; d.y += d.dy;
      if (d.x < 0) d.x = c.width; if (d.x > c.width) d.x = 0;
      if (d.y < 0) d.y = c.height; if (d.y > c.height) d.y = 0;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${d.a})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
