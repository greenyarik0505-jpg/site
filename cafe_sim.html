<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Моё Кафе</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
#hud{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;flex-shrink:0}
#hud h1{font-size:18px;color:#f0c040}
.hud-stat{display:flex;align-items:center;gap:6px;font-size:14px}
.hud-stat span{font-weight:700;color:#f0c040}
#rep-stars{font-size:18px;letter-spacing:2px}
#shop-btn{margin-left:auto;background:#1f3a5f;border:1px solid #58a6ff;color:#58a6ff;padding:6px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:background .15s}
#shop-btn:hover{background:#2a4f80}
#cafe-area{flex:1;display:flex;flex-direction:column;padding:12px;gap:12px;overflow-y:auto}
#queue-zone{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;min-height:64px}
#queue-zone h3{font-size:12px;color:#8b949e;margin-bottom:8px}
#queue-row{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
#tables-zone{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.table-card{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px;width:140px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;transition:border-color .2s,box-shadow .2s}
.table-card.occupied{border-color:#58a6ff;box-shadow:0 0 10px rgba(88,166,255,.2)}
.table-card.angry{border-color:#f85149;box-shadow:0 0 10px rgba(248,81,73,.25);animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.table-icon{font-size:28px}
.table-label{font-size:11px;color:#8b949e}
.table-order{font-size:22px;line-height:1}
.table-timer{width:100%;height:4px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:4px}
.table-timer-bar{height:100%;background:#3fb950;border-radius:2px;transition:width .5s linear,background .5s}
.guest-chip{background:#21262d;border:1px solid #30363d;border-radius:20px;padding:4px 10px;font-size:13px;cursor:pointer;transition:background .15s,border-color .15s;display:flex;align-items:center;gap:5px;animation:popIn .2s ease-out}
@keyframes popIn{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}
.guest-chip:hover{background:#30363d}
.action-btn{padding:5px 10px;border-radius:5px;border:1px solid #3fb950;background:#1a3320;color:#3fb950;font-size:12px;cursor:pointer;transition:background .15s}
.action-btn:hover{background:#234d2e}
.action-btn.serve{border-color:#f0c040;color:#f0c040;background:#332a00}
.action-btn.serve:hover{background:#4a3d00}
.coin-pop{position:fixed;pointer-events:none;font-size:18px;font-weight:700;color:#f0c040;text-shadow:0 0 8px #f0c040;animation:coinRise 1.2s ease-out forwards;z-index:999}
@keyframes coinRise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
#barista-zone{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#barista-zone h3{font-size:12px;color:#8b949e;white-space:nowrap}
#barista-queue{display:flex;flex-wrap:wrap;gap:6px}
.brew-card{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;transition:all .15s;animation:popIn .2s ease-out}
.brew-card:hover{border-color:#3fb950;background:#1a2d1e}
.brew-card .brew-progress{width:60px;height:5px;background:#30363d;border-radius:3px;overflow:hidden}
.brew-card .brew-bar{height:100%;background:#3fb950;border-radius:3px;transition:width .2s linear}
.brew-card.ready{border-color:#f0c040;background:#332a00}
.brew-card.ready:hover{background:#4a3d00}
#shop-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;justify-content:center;align-items:center}
#shop-modal.open{display:flex}
#shop-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;max-width:360px;width:90%;display:flex;flex-direction:column;gap:12px}
#shop-box h2{color:#f0c040;font-size:16px}
.upgrade-card{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.upgrade-card.bought{border-color:#3fb950;opacity:.7}
.upgrade-info{display:flex;flex-direction:column;gap:3px}
.upgrade-name{font-size:13px;font-weight:600}
.upgrade-desc{font-size:11px;color:#8b949e}
.upgrade-buy{padding:5px 12px;border-radius:5px;border:1px solid #58a6ff;background:#1f3a5f;color:#58a6ff;font-size:12px;cursor:pointer;white-space:nowrap}
.upgrade-buy:disabled{opacity:.4;cursor:default}
#close-shop{align-self:flex-end;padding:6px 14px;border-radius:5px;border:1px solid #f85149;background:transparent;color:#f85149;font-size:13px;cursor:pointer}
#msg-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#21262d;border:1px solid #30363d;border-radius:20px;padding:8px 18px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:100;white-space:nowrap}
#msg-bar.show{opacity:1}
</style>
</head>
<body>
<div id="hud">
  <h1>☕ Моё Кафе</h1>
  <div class="hud-stat">💰 <span id="coins-disp">0</span></div>
  <div class="hud-stat">⭐ <span id="rep-stars">★★★☆☆</span></div>
  <div class="hud-stat" style="font-size:12px;color:#8b949e">Репутация: <span id="rep-num" style="color:#e6edf3">3.0</span></div>
  <button id="shop-btn" onclick="openShop()">🛒 Улучшения</button>
</div>
<div id="cafe-area">
  <div id="queue-zone">
    <h3>👥 Очередь посетителей</h3>
    <div id="queue-row"></div>
  </div>
  <div id="barista-zone">
    <h3>👨‍🍳 Стойка бариста</h3>
    <div id="barista-queue"></div>
  </div>
  <div id="tables-zone"></div>
</div>
<div id="shop-modal">
  <div id="shop-box">
    <h2>🛒 Улучшения</h2>
    <div id="upgrades-list"></div>
    <button id="close-shop" onclick="closeShop()">Закрыть</button>
  </div>
</div>
<div id="msg-bar"></div>

<script>
let coins = 0;
let rep = 3.0;
let guestId = 0;
let tableCount = 3;
let tables = [];
let brewQueue = [];
let upgrades = {
  fastBarista: { name: 'Быстрый бариста', desc: 'Готовит на 40% быстрее', cost: 80, bought: false },
  extraTable: { name: 'Доп. столик', desc: 'Ещё один столик', cost: 120, bought: false },
  advert: { name: 'Реклама', desc: 'Гости приходят чаще', cost: 60, bought: false },
  premiumMenu: { name: 'Премиум меню', desc: 'Монет за заказ +50%', cost: 150, bought: false },
};
const ORDERS = [
  { icon: '☕', name: 'Кофе', time: 6, reward: 15 },
  { icon: '🍵', name: 'Чай', time: 4, reward: 10 },
  { icon: '🍰', name: 'Десерт', time: 8, reward: 20 },
  { icon: '🥐', name: 'Круассан', time: 3, reward: 12 },
  { icon: '🍫', name: 'Какао', time: 5, reward: 14 },
];
const PATIENCE = 22;
const GUEST_NAMES = ['Аня','Вася','Лёша','Маша','Коля','Даша','Женя','Катя','Серёжа','Тоня'];

function randOrder(){ return ORDERS[Math.floor(Math.random()*ORDERS.length)]; }

function initTables(){
  tables = [];
  for(let i=0;i<tableCount;i++) tables.push({ id:i, guest:null, state:'free', timer:0, order:null, brewId:null });
  renderTables();
}

function renderTables(){
  const zone = document.getElementById('tables-zone');
  zone.innerHTML = '';
  tables.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'table-card' + (t.guest ? ' occupied' : '') + (t.state==='angry' ? ' angry' : '');
    card.id = 'table-'+t.id;
    if(t.guest){
      const ratio = Math.max(0, t.timer / PATIENCE);
      const barColor = ratio > 0.6 ? '#3fb950' : ratio > 0.3 ? '#f0c040' : '#f85149';
      card.innerHTML = `
        <div class="table-icon">${t.guest.emoji}</div>
        <div style="font-size:12px;font-weight:600">${t.guest.name}</div>
        <div class="table-order">${t.order ? t.order.icon : '❓'}</div>
        <div style="font-size:10px;color:#8b949e">${stateLabel(t.state)}</div>
        <div class="table-timer"><div class="table-timer-bar" style="width:${ratio*100}%;background:${barColor}"></div></div>
      `;
      if(t.state==='waiting_order'){
        const btn=document.createElement('button');btn.className='action-btn';btn.textContent='Принять заказ';
        btn.onclick=()=>acceptOrder(t.id);card.appendChild(btn);
      }
      if(t.state==='ready_serve'){
        const btn=document.createElement('button');btn.className='action-btn serve';btn.textContent='Подать ☑';
        btn.onclick=()=>serveGuest(t.id);card.appendChild(btn);
      }
    }else{
      card.innerHTML = `<div class="table-icon">🪑</div><div class="table-label">Свободно</div>`;
    }
    zone.appendChild(card);
  });
}

function stateLabel(s){
  if(s==='waiting_order')return '⏳ Ждёт заказ...';
  if(s==='preparing')return '👨‍🍳 Готовится...';
  if(s==='ready_serve')return '✅ Готово!';
  return '';
}

let guestQueue = [];
function spawnGuest(){
  if(guestQueue.length >= 5) return;
  const g = {
    id: guestId++,
    name: GUEST_NAMES[Math.floor(Math.random()*GUEST_NAMES.length)],
    emoji: ['🧑','👩','🧔','👱','🧓','👨'][Math.floor(Math.random()*6)],
    waitTime: 0,
  };
  guestQueue.push(g);
  renderQueue();
}

function renderQueue(){
  const row = document.getElementById('queue-row');
  row.innerHTML = '';
  guestQueue.forEach(g=>{
    const chip = document.createElement('div');
    chip.className = 'guest-chip';
    chip.innerHTML = `${g.emoji} ${g.name}`;
    chip.title = 'Посадить за столик';
    chip.onclick = () => seatGuest(g.id);
    row.appendChild(chip);
  });
}

function seatGuest(gid){
  const freeTable = tables.find(t=>!t.guest);
  if(!freeTable){ showMsg('Нет свободных столиков!'); return; }
  const gIdx = guestQueue.findIndex(g=>g.id===gid);
  if(gIdx<0) return;
  const g = guestQueue.splice(gIdx,1)[0];
  freeTable.guest = g;
  freeTable.state = 'waiting_order';
  freeTable.timer = PATIENCE;
  freeTable.order = randOrder();
  freeTable.brewId = null;
  renderQueue();
  renderTables();
}

function acceptOrder(tid){
  const t = tables[tid];
  if(!t||t.state!=='waiting_order') return;
  const brewTime = t.order.time * (upgrades.fastBarista.bought ? 0.6 : 1);
  const bItem = { id: Date.now(), tableId: tid, order: t.order, progress: 0, total: brewTime, done: false };
  brewQueue.push(bItem);
  t.state = 'preparing';
  t.brewId = bItem.id;
  renderTables();
  renderBaristaQueue();
}

function renderBaristaQueue(){
  const bq = document.getElementById('barista-queue');
  bq.innerHTML = '';
  if(brewQueue.length===0){ bq.innerHTML='<span style="font-size:12px;color:#8b949e">Пусто</span>'; return; }
  brewQueue.forEach(b=>{
    const card = document.createElement('div');
    card.className = 'brew-card' + (b.done?' ready':'');
    const pct = Math.min(100, (b.progress/b.total)*100);
    card.innerHTML = `<span>${b.order.icon}</span><span style="font-size:12px">${b.order.name}</span><div class="brew-progress"><div class="brew-bar" style="width:${pct}%"></div></div>`;
    if(b.done){
      card.title='Нажми чтобы подать';
      card.onclick=()=>serveGuest(b.tableId);
    }
    bq.appendChild(card);
  });
}

function serveGuest(tid){
  const t = tables[tid];
  if(!t||t.state!=='ready_serve') return;
  const bi = brewQueue.findIndex(b=>b.tableId===tid&&b.done);
  if(bi<0) return;
  brewQueue.splice(bi,1);
  const reward = Math.round(t.order.reward * (upgrades.premiumMenu.bought ? 1.5 : 1));
  coins += reward;
  showCoinPop(reward, document.getElementById('table-'+tid));
  changeRep(+0.1);
  showMsg(`${t.guest.name} доволен! +${reward}💰`);
  t.guest = null; t.state = 'free'; t.timer = 0; t.order = null; t.brewId = null;
  updateHUD();
  renderTables();
  renderBaristaQueue();
}

function showCoinPop(amount, ref){
  const el = document.createElement('div');
  el.className = 'coin-pop';
  el.textContent = '+'+amount+'💰';
  const rect = ref ? ref.getBoundingClientRect() : {left:window.innerWidth/2, top:window.innerHeight/2};
  el.style.left = (rect.left + rect.width/2 - 20) + 'px';
  el.style.top = (rect.top - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1300);
}

function changeRep(delta){
  rep = Math.max(1, Math.min(5, rep + delta));
  updateHUD();
}

function updateHUD(){
  document.getElementById('coins-disp').textContent = coins;
  document.getElementById('rep-num').textContent = rep.toFixed(1);
  const full = Math.floor(rep);
  const half = rep - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  document.getElementById('rep-stars').textContent = '★'.repeat(full) + (half?'½':'') + '☆'.repeat(empty);
}

let msgTimer = null;
function showMsg(text){
  const bar = document.getElementById('msg-bar');
  bar.textContent = text;
  bar.classList.add('show');
  clearTimeout(msgTimer);
  msgTimer = setTimeout(()=>bar.classList.remove('show'), 2000);
}

function openShop(){
  renderUpgrades();
  document.getElementById('shop-modal').classList.add('open');
}
function closeShop(){ document.getElementById('shop-modal').classList.remove('open'); }

function renderUpgrades(){
  const list = document.getElementById('upgrades-list');
  list.innerHTML = '';
  Object.entries(upgrades).forEach(([key,upg])=>{
    const card = document.createElement('div');
    card.className = 'upgrade-card' + (upg.bought?' bought':'');
    const canBuy = !upg.bought && coins >= upg.cost;
    card.innerHTML = `
      <div class="upgrade-info">
        <div class="upgrade-name">${upg.name}</div>
        <div class="upgrade-desc">${upg.desc}</div>
      </div>
      <button class="upgrade-buy" ${upg.bought?'disabled':''} onclick="buyUpgrade('${key}')">
        ${upg.bought ? '✅' : `${upg.cost}💰`}
      </button>
    `;
    list.appendChild(card);
  });
}

function buyUpgrade(key){
  const upg = upgrades[key];
  if(upg.bought||coins<upg.cost) return;
  coins -= upg.cost;
  upg.bought = true;
  if(key==='extraTable'){
    tableCount++;
    tables.push({ id:tables.length, guest:null, state:'free', timer:0, order:null, brewId:null });
    renderTables();
  }
  updateHUD();
  renderUpgrades();
  showMsg(upg.name + ' куплено!');
}

let spawnInterval = 5000;
let lastSpawn = 0;
let lastTick = performance.now();

function gameLoop(now){
  requestAnimationFrame(gameLoop);
  const dt = (now - lastTick) / 1000;
  lastTick = now;

  if(now - lastSpawn > (upgrades.advert.bought ? spawnInterval * 0.65 : spawnInterval)){
    lastSpawn = now;
    if(Math.random() < 0.75) spawnGuest();
  }

  let needRender = false;
  brewQueue.forEach(b=>{
    if(!b.done){
      b.progress += dt;
      if(b.progress >= b.total){
        b.done = true;
        const t = tables[b.tableId];
        if(t){ t.state='ready_serve'; needRender=true; }
      }
    }
  });

  tables.forEach(t=>{
    if(t.guest && t.state !== 'free'){
      t.timer -= dt;
      if(t.timer <= 0){
        showMsg(`${t.guest.name} ушёл(а) разочарованным 😞`);
        changeRep(-0.2);
        if(t.brewId){ const bi=brewQueue.findIndex(b=>b.id===t.brewId); if(bi>=0)brewQueue.splice(bi,1); }
        t.guest=null;t.state='free';t.timer=0;t.order=null;t.brewId=null;
        needRender=true;
      }
    }
  });

  if(needRender){ renderTables(); renderBaristaQueue(); }
  else if(Math.floor(now/300) !== Math.floor((now-dt*1000)/300)){ renderTables(); renderBaristaQueue(); }
}

initTables();
updateHUD();
requestAnimationFrame(gameLoop);
</script>
