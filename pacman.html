<style>

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050511;color:#fff;font-family:Arial,sans-serif;touch-action:none;user-select:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 15%,#10135a,#050511 58%)}
.portal-home-btn{position:fixed;top:12px;left:12px;z-index:10050;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.58);color:#fff;padding:9px 14px;border-radius:14px;font:800 13px Arial,sans-serif;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
.wrap{width:min(94vmin,640px);display:grid;gap:12px;justify-items:center}
.hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-weight:900}

.controls button,.start{border:0;border-radius:14px;background:#ffe66d;color:#191300;font-weight:900;font-size:22px;box-shadow:0 6px 0 #a88a00}
.controls button:active,.start:active{transform:translateY(4px);box-shadow:0 2px 0 #a88a00}
.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
.start{padding:12px 24px;font-size:16px}
.note{color:rgba(255,255,255,.65);font-size:13px;text-align:center}

<a class="portal-home-btn" href="index.html">Главное меню</a>
<main class="wrap">
  <div class="hud"><div class="title">Pac-Man</div><div class="score">Счет: <span id="score">0</span></div></div>
  <canvas id="game" width="460" height="460"></canvas>
  <button class="start" id="startBtn">Старт / заново</button>
  <div class="controls" aria-label="Управление">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <div class="note">Собери все точки и избегай призраков.</div>
</main>
<script>
const map=[
'###################',
'#........#........#',
'#.###.##.#.##.###.#',
'#.................#',
'#.###.#.###.#.###.#',
'#.....#..#..#.....#',
'#####.## # ##.#####',
'#.................#',
'#.###.##.#.##.###.#',
'#...#....P....#...#',
'###.#.#######.#.###',
'#.................#',
'#.###.#.###.#.###.#',
'#.....#..#..#.....#',
'#.######.#.######.#',
'#.................#',
'###################'];
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score');
const rows=map.length,cols=map[0].length,cell=canvas.width/cols;
let walls,dots,pac,ghosts,dir,nextDir,score,timer,mouth=0;
function reset(){walls=[];dots=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){const ch=map[y][x];if(ch==='#')walls.push({x,y});else if(ch==='.')dots.push({x,y});if(ch==='P')pac={x,y};}ghosts=[{x:9,y:7,c:'#ff4d6d'},{x:8,y:7,c:'#60a5fa'},{x:10,y:7,c:'#f472b6'}];dir={x:0,y:0};nextDir={x:0,y:0};score=0;scoreEl.textContent=0;clearInterval(timer);timer=setInterval(step,150);draw();}
function isWall(x,y){return walls.some(w=>w.x===x&&w.y===y)}
function setDir(name){const m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};if(m[name])nextDir=m[name];}
function canMove(p,d){return !isWall(p.x+d.x,p.y+d.y)}
function step(){if(canMove(pac,nextDir))dir=nextDir;if(canMove(pac,dir)){pac={x:pac.x+dir.x,y:pac.y+dir.y}}const idx=dots.findIndex(d=>d.x===pac.x&&d.y===pac.y);if(idx>=0){dots.splice(idx,1);score++;scoreEl.textContent=score;if(!dots.length){clearInterval(timer);draw('Победа!');return;}}ghosts.forEach(g=>moveGhost(g));if(ghosts.some(g=>g.x===pac.x&&g.y===pac.y)){clearInterval(timer);draw('Поймали!');return;}mouth=(mouth+1)%8;draw();}
function moveGhost(g){const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}].filter(d=>!isWall(g.x+d.x,g.y+d.y));dirs.sort((a,b)=>Math.hypot(pac.x-(g.x+a.x),pac.y-(g.y+a.y))-Math.hypot(pac.x-(g.x+b.x),pac.y-(g.y+b.y)));const d=Math.random()<.72?dirs[0]:dirs[Math.floor(Math.random()*dirs.length)];if(d){g.x+=d.x;g.y+=d.y;}}
function draw(msg){ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);walls.forEach(w=>{ctx.fillStyle='#1d4ed8';ctx.fillRect(w.x*cell,w.y*cell,cell,cell);ctx.strokeStyle='#5b7cff';ctx.strokeRect(w.x*cell+2,w.y*cell+2,cell-4,cell-4)});dots.forEach(d=>{ctx.fillStyle='#ffe8a3';ctx.beginPath();ctx.arc(d.x*cell+cell/2,d.y*cell+cell/2,3,0,Math.PI*2);ctx.fill();});const angle=mouth<4?.25:.08;let start=angle*Math.PI,end=(2-angle)*Math.PI;if(dir.x<0){start+=Math.PI;end+=Math.PI}else if(dir.y<0){start-=Math.PI/2;end-=Math.PI/2}else if(dir.y>0){start+=Math.PI/2;end+=Math.PI/2}ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.moveTo(pac.x*cell+cell/2,pac.y*cell+cell/2);ctx.arc(pac.x*cell+cell/2,pac.y*cell+cell/2,cell*.42,start,end);ctx.closePath();ctx.fill();ghosts.forEach(g=>{ctx.fillStyle=g.c;ctx.beginPath();ctx.arc(g.x*cell+cell/2,g.y*cell+cell/2,cell*.38,Math.PI,0);ctx.lineTo(g.x*cell+cell*.88,g.y*cell+cell*.85);ctx.lineTo(g.x*cell+cell*.12,g.y*cell+cell*.85);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(g.x*cell+cell*.38,g.y*cell+cell*.45,3,0,Math.PI*2);ctx.arc(g.x*cell+cell*.62,g.y*cell+cell*.45,3,0,Math.PI*2);ctx.fill();});if(msg){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,185,460,90);ctx.fillStyle='#fff';ctx.font='700 30px Arial';ctx.textAlign='center';ctx.fillText(msg,230,240);}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')setDir('up');if(e.key==='ArrowDown')setDir('down');if(e.key==='ArrowLeft')setDir('left');if(e.key==='ArrowRight')setDir('right');});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(b.dataset.dir));
document.getElementById('startBtn').onclick=reset;
reset();
</script>

    setTimeout(function(){ov.style.display='none';clearTimeout(_bigtextTimeout);},6000);
  }
  function trollUpsideText(){
    var style=document.createElement('style');style.id='troll-upside-style';
    style.textContent='p,h1,h2,h3,h4,span,a,button,label{transform:rotate(180deg) !important;display:inline-block !important}';
    document.head.appendChild(style);setTimeout(function(){style.remove();},5000);
  }
  function trollSlowMo(){
    document.documentElement.style.animationDuration='500%';document.documentElement.style.transitionDuration='500%';
    setTimeout(function(){document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';},6000);
  }
  function trollScaleCrazy(){
    clearInterval(_scaleCrazyInterval);
    _scaleCrazyInterval=setInterval(function(){
      var cards=document.querySelectorAll('.game-card');if(!cards.length)return;
      var card=cards[Math.floor(Math.random()*cards.length)];
      card.style.transform='scale(1.5)';card.style.zIndex='200';card.style.transition='transform .1s';
      setTimeout(function(){card.style.transform='';card.style.zIndex='';},180);
    },200);
    setTimeout(function(){clearInterval(_scaleCrazyInterval);document.querySelectorAll('.game-card').forEach(function(c){c.style.transform='';c.style.zIndex='';});},5000);
  }
  function trollColorInvert(){document.body.style.filter='invert(1)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},5000);}
  function trollReset(){
    document.body.style.transform='';document.body.style.filter='';document.body.style.opacity='';
    document.getElementById('troll-matrix').style.display='none';clearInterval(_matrixInterval);
    document.getElementById('troll-virus').style.display='none';
    document.getElementById('troll-disco').style.display='none';clearTimeout(_discoTimeout);
    document.getElementById('troll-rainbow-overlay').style.display='none';
    document.getElementById('troll-glitch').style.display='none';document.getElementById('troll-glitch').innerHTML='';clearInterval(_glitchInterval);
    document.getElementById('troll-typewriter').style.display='none';clearInterval(_typewriterInterval);
    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();var map={'new_game':'bubblepop','flappy_bird':'flappy','tic_tac_toe':'tictactoe','pixel_art':'pixelart','cafe_sim':'cafesim'};var raw=(location.pathname.split('/').pop()||'index.html').toLowerCase().replace(/\.html$/,'');var gid=map[raw]||raw;if(data&&data.time>lastTrollTime&&(!data.target||data.target==='all'||data.target===gid)){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
</script>
