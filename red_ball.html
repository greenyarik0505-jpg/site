let soundEnabled = true;
const SFX = new (function () {
  let ctx = null;
  const init = () => {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
  };
  const tone = (f1, f2, dur, type = 'sine', vol = 0.2) => {
    if (!soundEnabled) return;
    try {
      init();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type;
      const t = ctx.currentTime;
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  };
  this.resume  = () => { try { init(); } catch (e) {} };
  this.jump    = () => tone(350, 620, 0.11);
  this.die     = () => tone(400, 90, 0.35, 'sawtooth');
  this.coin    = () => tone(880, 1200, 0.09);
  this.stomp   = () => tone(200, 55, 0.15, 'square');
  this.spring  = () => tone(260, 900, 0.18, 'sine', 0.25);
  this.crumble = () => tone(120, 40, 0.3, 'sawtooth', 0.15);
  this.finish  = () => [523,659,784,1047].forEach((f,i) => setTimeout(() => tone(f, f*1.05, 0.18), i * 110));
  this.victory = () => [523,659,784,1047,1319].forEach((f,i) => setTimeout(() => tone(f, f*1.06, 0.22), i * 130));
  this.click   = () => tone(600, 700, 0.06);
})();

    g.fillStyle(0xff8888, 0.7); g.fillCircle(22, 20, 9);

// =================================================================
//  ВСПОМОГАТЕЛЬНАЯ ФУНКЦИЯ: стильная кнопка
// =================================================================
function makeTextBtn(scene, x, y, icon, label, fontSize, colors, cb, btnW, btnH) {
  const w = btnW || (fontSize === '36px' ? 340 : 320);
  const h = btnH || (fontSize === '36px' ? 64 : 54);
  const r = 18;

  const gfx = scene.add.graphics();
  gfx.fillStyle(colors.bg, 1);
  gfx.fillRoundedRect(x - w/2, y - h/2, w, h, r);
  gfx.fillGradientStyle(colors.top, colors.top, colors.bg, colors.bg, 0.5, 0.5, 0, 0);
  gfx.fillRoundedRect(x - w/2 + 2, y - h/2 + 2, w - 4, h/2 - 2, { tl: r-2, tr: r-2, bl: 0, br: 0 });
  gfx.lineStyle(1.5, 0xffffff, 0.12);
  gfx.strokeRoundedRect(x - w/2, y - h/2, w, h, r);

  const txt = scene.add.text(x, y, `${icon}  ${label}`, {
    fontSize, fontFamily: 'Nunito, sans-serif', fontStyle: 'bold', color: '#fff',
    shadow: { offsetX: 0, offsetY: 2, color: '#00000066', blur: 4, fill: true },
  }).setOrigin(0.5);

  const hitZone = scene.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
  hitZone.on('pointerover', () => {
    scene.tweens.add({ targets: [gfx, txt], scaleX: 1.03, scaleY: 1.03, duration: 80, ease: 'Sine.easeOut' });
  });
  hitZone.on('pointerout', () => {
    scene.tweens.add({ targets: [gfx, txt], scaleX: 1, scaleY: 1, duration: 80, ease: 'Sine.easeOut' });
  });
  hitZone.on('pointerdown', () => { SFX.click(); cb(); });
  return { gfx, txt, hitZone };
}

    bg.fillRect(0, 0, W, H);

        cardG.strokeRoundedRect(col - 108, row - 74, 216, 148, 16);

        const hitZ = this.add.zone(col, row, 216, 148).setInteractive({ useHandCursor: true });

// =================================================================
//  СЦЕНА: ИГРА
// =================================================================
class GameScene extends Phaser.Scene {
  constructor() { super({ key: 'GameScene' }); }

  create() {
    const lvl = LEVELS[currentLevel];
    this.cameras.main.setBackgroundColor(lvl.sky);
    this.cameras.main.fadeIn(360, 0, 0, 0);
    buildTextures(this);

    this.isDead    = false;
    this.levelDone = false;
    this.paused    = false;
    this.touchLeft  = false;
    this.touchRight = false;
    this.touchJump  = false;
    this._prevTJ   = false;

    this._addDecor(lvl);

    // ---- Статичные платформы (масштабируем под 64px тайлы) ----
    const tileW = 64;
    this.platforms = this.physics.add.staticGroup();
    lvl.platforms.forEach(([px, py, pw]) => {
      for (let c = 0; c < Math.ceil(pw / 32); c++) {
        const spr = this.platforms.create(px + c * 32 + 16, py + 10, lvl.platKey);
        spr.setScale(0.5, 1).refreshBody();
      }
    });

    // ---- Движущиеся платформы ----
    this.movPlats     = [];
    this.movPlatGroup = this.physics.add.group();
    (lvl.movingPlats || []).forEach(mp => {
      const obj = { sprites:[], dir:1, spd:mp.spd, left:mp.x-mp.range, right:mp.x+mp.range };
      for (let c = 0; c < Math.ceil(mp.w / 32); c++) {
        const spr = this.physics.add.image(mp.x + c * 32 + 16, mp.y + 10, 'plat_m');
        spr.setScale(0.5, 1);
        spr.body.setAllowGravity(false).setImmovable(true).setVelocityX(mp.spd);
        obj.sprites.push(spr);
        this.movPlatGroup.add(spr);
      }
      this.movPlats.push(obj);
    });

    // ---- Рушащиеся фиолетовые платформы ----
    this.crumbleData  = [];
    this.crumbleGroup = this.physics.add.staticGroup();
    (lvl.crumblePlats || []).forEach(cp => {
      const tiles = [];
      const cols = Math.ceil(cp.w / 32);
      for (let c = 0; c < cols; c++) {
        const spr = this.crumbleGroup.create(cp.x + c * 32 + 16, cp.y + 10, 'plat_m');
        spr.setScale(0.5, 1).refreshBody();
        tiles.push(spr);
      }
      this.crumbleData.push({
        tiles, origX: cp.x, origY: cp.y, w: cp.w,
        state: 'solid', timer: 0,
      });
    });

    // ---- Трамплины ----
    this.springGroup = this.physics.add.staticGroup();
    (lvl.springs || []).forEach(sp => {
      const spr = this.springGroup.create(sp.x, sp.y, 'spring');
      spr.body.setSize(24, 10).setOffset(4, 18);
      spr.refreshBody();
    });

    // ---- Шипы ----
    this.spikes = this.physics.add.staticGroup();
    lvl.spikes.forEach(([sx, sy]) => {
      const s = this.spikes.create(sx + 12, sy + 10, 'spike');
      s.body.setSize(14, 14).setOffset(5, 5); s.refreshBody();
    });

    // ---- Монеты ----
    this.coins = this.physics.add.staticGroup();
    lvl.coins.forEach(c => {
      const coin = this.coins.create(c.x, c.y, 'coin');
      coin.refreshBody();
      this.tweens.add({ targets: coin, y: c.y - 8, yoyo: true, repeat: -1, duration: 600 + Math.random() * 300, ease: 'Sine.easeInOut' });
    });

    // ---- Наземные враги ----
    this.enemies   = this.physics.add.group();
    this.enemyMeta = [];
    lvl.enemies.forEach(en => {
      const spr = this.physics.add.sprite(en.x + 18, en.y - 20, 'enemy');
      spr.body.setAllowGravity(true).setVelocityX(en.spd);
      spr.setCollideWorldBounds(true);
      this.enemies.add(spr);
      this.enemyMeta.push({ spr, left: en.x - en.range, right: en.x + en.range + 36, spd: en.spd });
    });

    // ---- Летающие враги ----
    this.flyEnemies   = this.physics.add.group();
    this.flyEnemyMeta = [];
    (lvl.flyingEnemies || []).forEach(fe => {
      const spr = this.physics.add.sprite(fe.x + 18, fe.y, 'enemy_fly');
      spr.body.setAllowGravity(false);
      spr.setCollideWorldBounds(true);
      this.flyEnemies.add(spr);
      this.flyEnemyMeta.push({
        spr,
        startX: fe.x + 18, startY: fe.y,
        rangeX: fe.rangeX, ampY: fe.ampY, spd: fe.spd,
        dir: 1, time: 0,
      });
    });

    // ---- Финиш ----
    this.finishStar = this.physics.add.staticImage(lvl.finish.x, lvl.finish.y, 'finish');
    this.finishStar.body.setSize(30, 30).setOffset(13, 13); this.finishStar.refreshBody();
    this.tweens.add({ targets: this.finishStar, scale: 1.25, yoyo: true, repeat: -1, duration: 600, ease: 'Sine.easeInOut' });

    // ---- Игрок ----
    this.ball = this.physics.add.sprite(lvl.start.x, lvl.start.y, 'ball');
    this.ball.setCollideWorldBounds(true).setBounce(0.08);
    this.ball.body.setCircle(18, 14, 14);

    // ---- Коллизии ----
    this.physics.add.collider(this.ball, this.platforms);
    this.physics.add.collider(this.ball, this.movPlatGroup);
    this.physics.add.collider(this.ball, this.crumbleGroup, this._onCrumbleTouch, null, this);
    this.physics.add.collider(this.enemies, this.platforms);
    this.physics.add.collider(this.enemies, this.movPlatGroup);
    this.physics.add.collider(this.enemies, this.crumbleGroup);

    this.physics.add.overlap(this.ball, this.finishStar,   this._onFinish,  null, this);
    this.physics.add.overlap(this.ball, this.spikes,       this._onSpike,   null, this);
    this.physics.add.overlap(this.ball, this.coins,        this._onCoin,    null, this);
    this.physics.add.overlap(this.ball, this.enemies,      this._onEnemy,   null, this);
    this.physics.add.overlap(this.ball, this.flyEnemies,   this._onEnemy,   null, this);
    this.physics.add.overlap(this.ball, this.springGroup,  this._onSpring,  null, this);

    // ---- Ввод ----
    this.keys = this.input.keyboard.addKeys({
      left:  Phaser.Input.Keyboard.KeyCodes.LEFT,
      right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
      up:    Phaser.Input.Keyboard.KeyCodes.UP,
      a:     Phaser.Input.Keyboard.KeyCodes.A,
      d:     Phaser.Input.Keyboard.KeyCodes.D,
      w:     Phaser.Input.Keyboard.KeyCodes.W,
      space: Phaser.Input.Keyboard.KeyCodes.SPACE,
      esc:   Phaser.Input.Keyboard.KeyCodes.ESC,
    });
    this.keys.esc.on('down', () => this._togglePause());

    this._createHUD();
    this._createMobileControls();

    if (currentLevel === 0) {
      const tipG = this.add.graphics().setScrollFactor(0).setDepth(20);
      tipG.fillStyle(0x000000, 0.5);
      tipG.fillRoundedRect(100, 12, 600, 30, 8);
      const t = this.add.text(400, 27, '← → двигайся   ↑ прыгай   🟣 осторожно!   🟢 трамплин!', {
        fontSize: '12px', fontFamily: 'Nunito, sans-serif', color: '#ffffffcc'
      }).setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(21);
      this.time.delayedCall(5000, () => { if (t && t.active) t.destroy(); if (tipG && tipG.active) tipG.destroy(); });
    }
  }

  // ----------------------------------------------------------------
  _addDecor(lvl) {
    const bg = this.add.graphics();

    if (currentLevel <= 1) {
      // Градиентное небо
      bg.fillGradientStyle(lvl.sky, lvl.sky, lvl.skyBot, lvl.skyBot, 1);
      bg.fillRect(0, 0, 800, 600);

      // Облака
      bg.fillStyle(0xffffff, 0.35);
      [[80, 60], [280, 40], [500, 70], [680, 35]].forEach(([cx, cy]) => {
        bg.fillEllipse(cx, cy, 80, 36);
        bg.fillEllipse(cx + 28, cy - 12, 56, 30);
        bg.fillEllipse(cx - 22, cy - 6, 48, 26);
      });
      bg.fillStyle(0xffffff, 0.2);
      [[160, 90], [420, 55]].forEach(([cx, cy]) => {
        bg.fillEllipse(cx, cy, 60, 28);
        bg.fillEllipse(cx + 20, cy - 8, 40, 22);
      });
    } else {
      bg.fillGradientStyle(lvl.sky, lvl.sky, lvl.skyBot, lvl.skyBot, 1);
      bg.fillRect(0, 0, 800, 600);

      // Звёзды
      for (let i = 0; i < 100; i++) {
        const a = 0.2 + Math.random() * 0.6;
        bg.fillStyle(0xffffff, a);
        bg.fillCircle(Phaser.Math.Between(0, 800), Phaser.Math.Between(0, 380), 0.5 + Math.random() * 1.8);
      }
      // Луна
      bg.fillStyle(0xf5f5dc, 0.08); bg.fillCircle(700, 55, 45);
      bg.fillStyle(0xf5f5dc, 0.7); bg.fillCircle(700, 55, 28);
      bg.fillStyle(lvl.sky); bg.fillCircle(710, 48, 22);
    }
  }

  // ----------------------------------------------------------------
  _createHUD() {
    const hudG = this.add.graphics().setScrollFactor(0).setDepth(30);
    hudG.fillStyle(0x000000, 0.4);
    hudG.fillRoundedRect(6, 6, 788, 38, 10);

    this._hearts = [];
    for (let i = 0; i < 3; i++) {
      const h = this.add.image(26 + i * 28, 25, 'heart').setScrollFactor(0).setDepth(31).setScale(0.9);
      this._hearts.push(h);
    }
    this._updateHearts();

    this._lvlText = this.add.text(400, 17, LEVELS[currentLevel].name, {
      fontSize: '14px', fontFamily: 'Nunito, sans-serif', color: '#f1c40f', fontStyle: 'bold'
    }).setOrigin(0.5, 0).setScrollFactor(0).setDepth(31);

    this._scoreText = this.add.text(770, 17, `⭐ ${score}`, {
      fontSize: '14px', fontFamily: 'Nunito, sans-serif', color: '#fff', fontStyle: 'bold'
    }).setOrigin(1, 0).setScrollFactor(0).setDepth(31);
  }

  _updateHearts() { this._hearts.forEach((h, i) => h.setAlpha(i < lives ? 1 : 0.2)); }
  _updateScore()  { this._scoreText && this._scoreText.setText(`⭐ ${score}`); }

  // ----------------------------------------------------------------
  _createMobileControls() {
    const d = 45;

    const mkBtn = (x, y, w, h, col, lbl, onDown, onUp) => {
      const g = this.add.graphics().setScrollFactor(0).setDepth(d);
      g.fillStyle(col, 0.35);
      g.fillRoundedRect(x - w/2, y - h/2, w, h, 14);
      g.lineStyle(1.5, 0xffffff, 0.15);
      g.strokeRoundedRect(x - w/2, y - h/2, w, h, 14);

      this.add.text(x, y, lbl, {
        fontSize: '24px', fontFamily: 'Nunito, sans-serif', color: '#fff'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(d + 1);

      const z = this.add.zone(x, y, w, h).setScrollFactor(0).setDepth(d + 2).setInteractive();
      z.on('pointerdown', onDown);
      z.on('pointerup',   onUp);
      z.on('pointerout',  onUp);
    };

    mkBtn(58,  548, 95, 62, 0x444444, '◀', () => { this.touchLeft = true; }, () => { this.touchLeft = false; });
    mkBtn(160, 548, 95, 62, 0x444444, '▶', () => { this.touchRight = true; }, () => { this.touchRight = false; });
    mkBtn(742, 548, 95, 62, 0xcc0000, '↑', () => { this.touchJump = true; }, () => { this.touchJump = false; });

    const pauseG = this.add.graphics().setScrollFactor(0).setDepth(32);

    const pz = this.add.zone(764, 60, 48, 28).setScrollFactor(0).setDepth(34).setInteractive({ useHandCursor: true });
    pz.on('pointerdown', () => this._togglePause());
  }

  // ----------------------------------------------------------------
  _togglePause() {
    this.paused = !this.paused;
    if (this.paused) {
      this.physics.pause();
      this._po = this.add.graphics().setScrollFactor(0).setDepth(60);
      this._po.fillStyle(0x000000, 0.75);
      this._po.fillRect(0, 0, 800, 600);

      const cardG = this.add.graphics().setScrollFactor(0).setDepth(60);
      cardG.fillStyle(0x1a1a3a, 0.95);

      cardG.lineStyle(2, 0x4466aa);
      cardG.strokeRoundedRect(250, 180, 300, 240, 20);
      this._pc2 = cardG;

      this._pt = this.add.text(400, 220, 'ПАУЗА', {
        fontSize: '42px', fontFamily: 'Nunito, sans-serif', fontStyle: '900', color: '#fff',
      }).setOrigin(0.5).setScrollFactor(0).setDepth(61);

      this._pc = this.add.text(400, 270, 'ESC — продолжить', {
        fontSize: '16px', fontFamily: 'Nunito, sans-serif', color: '#8899bb'
      }).setOrigin(0.5).setScrollFactor(0).setDepth(61);

      const mb = this.add.text(400, 370, '[ Главное меню ]', {

      }).setOrigin(0.5).setScrollFactor(0).setDepth(61).setInteractive({ useHandCursor: true });
      mb.on('pointerover', () => mb.setAlpha(0.7));
      mb.on('pointerout', () => mb.setAlpha(1));
      mb.on('pointerdown', () => { this.physics.resume(); this.paused = false; this.scene.start('MenuScene'); });
      this._pm = mb;
    } else {
      this.physics.resume();
      [this._po, this._pt, this._pc, this._pm, this._pc2].forEach(o => o && o.destroy());
    }
  }

  // ----------------------------------------------------------------
  _onCrumbleTouch(ball, tile) {
    if (this.isDead || this.levelDone) return;
    if (!this.ball.body.blocked.down) return;

    const cd = this.crumbleData.find(c => c.tiles.includes(tile));
    if (!cd || cd.state !== 'solid') return;

    cd.state = 'shaking';
    cd.timer = 0;

    cd.tiles.forEach(t => {
      this.tweens.add({
        targets: t, x: t.x + 2, yoyo: true, repeat: 5, duration: 50,
        ease: 'Sine.easeInOut',
      });
    });

    this.time.delayedCall(600, () => {
      if (cd.state !== 'shaking') return;
      cd.state = 'falling';
      SFX.crumble();

      cd.tiles.forEach(t => {
        this.crumbleGroup.remove(t, true, false);
        const dyn = this.physics.add.image(t.x, t.y, 'plat_m');
        dyn.setScale(0.5, 1);
        dyn.body.setAllowGravity(true).setImmovable(false);
        dyn.setAlpha(0.6);
        this.tweens.add({ targets: dyn, alpha: 0, duration: 800, onComplete: () => dyn.destroy() });
      });

      cd.tiles = [];

      this.time.delayedCall(3000, () => {
        this._respawnCrumble(cd);
      });
    });
  }

  _respawnCrumble(cd) {
    const cols = Math.ceil(cd.w / 32);
    cd.tiles = [];
    for (let c = 0; c < cols; c++) {
      const spr = this.crumbleGroup.create(cd.origX + c * 32 + 16, cd.origY + 10, 'plat_m');
      spr.setScale(0.5, 1).setAlpha(0);
      spr.refreshBody();
      cd.tiles.push(spr);
      this.tweens.add({ targets: spr, alpha: 1, duration: 400 });
    }
    cd.state = 'solid';
  }

  // ----------------------------------------------------------------
  _burstParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const size = 3 + Math.random() * 4;
      const p = this.add.circle(x, y, size, color).setDepth(5);
      const angle = Math.random() * Math.PI * 2;
      const speed = 60 + Math.random() * 120;
      const tx = x + Math.cos(angle) * speed;
      const ty = y + Math.sin(angle) * speed - 30;
      this.tweens.add({
        targets: p, x: tx, y: ty, alpha: 0,
        scaleX: 0.1, scaleY: 0.1,
        duration: 350 + Math.random() * 250,
        ease: 'Quad.easeOut',
        onComplete: () => p.destroy(),
      });
    }
  }

  // ----------------------------------------------------------------
  update(time, delta) {
    if (this.isDead || this.levelDone || this.paused) return;

    const gr  = this.ball.body.blocked.down;
    const gl  = this.keys.left.isDown  || this.keys.a.isDown || this.touchLeft;
    const gR  = this.keys.right.isDown || this.keys.d.isDown || this.touchRight;
    const jKb = Phaser.Input.Keyboard.JustDown(this.keys.up) ||
                Phaser.Input.Keyboard.JustDown(this.keys.w)  ||
                Phaser.Input.Keyboard.JustDown(this.keys.space);
    const jTch = this.touchJump && !this._prevTJ && gr;
    this._prevTJ = this.touchJump;

    if (gl)       this.ball.setVelocityX(-238);
    else if (gR)  this.ball.setVelocityX( 238);
    else          this.ball.setVelocityX(this.ball.body.velocity.x * 0.74);

    if ((jKb || jTch) && gr) { this.ball.setVelocityY(-535); SFX.jump(); }

    this.ball.angle += this.ball.body.velocity.x * 0.011;

    // Движущиеся платформы
    this.movPlats.forEach(mp => {
      const f = mp.sprites[0]; if (!f) return;
      const newDir = f.x <= mp.left ? 1 : f.x >= mp.right ? -1 : mp.dir;
      if (newDir !== mp.dir) { mp.dir = newDir; mp.sprites.forEach(s => s.body.setVelocityX(mp.spd * newDir)); }
    });

    // Наземные враги
    this.enemyMeta.forEach(em => {
      if (!em.spr.active) return;
      if (em.spr.x <= em.left)  { em.spr.body.setVelocityX( em.spd); em.spr.setFlipX(false); }
      if (em.spr.x >= em.right) { em.spr.body.setVelocityX(-em.spd); em.spr.setFlipX(true);  }
      if (!em._jt) em._jt = 0;
      em._jt += delta;
      if (em._jt > 1800 + Math.random() * 600 && em.spr.body.blocked.down) {
        em.spr.body.setVelocityY(-280);
        em._jt = 0;
      }
    });

    // Летающие враги
    const dt = delta / 1000;
    this.flyEnemyMeta.forEach(fe => {
      if (!fe.spr.active) return;
      fe.time += dt;
      const cx = fe.startX;
      if (fe.spr.x <= cx - fe.rangeX)      { fe.dir =  1; fe.spr.setFlipX(false); }
      else if (fe.spr.x >= cx + fe.rangeX) { fe.dir = -1; fe.spr.setFlipX(true);  }
      fe.spr.body.setVelocityX(fe.spd * fe.dir);
      fe.spr.y = fe.startY + Math.sin(fe.time * 3) * fe.ampY;
    });
  }

  // ----------------------------------------------------------------
  _onFinish() {
    if (this.levelDone) return;
    this.levelDone = true;
    SFX.finish();
    this._burstParticles(this.finishStar.x, this.finishStar.y, 0xf1c40f, 25);
    this.cameras.main.flash(400, 255, 240, 80);
    this.time.delayedCall(560, () => {
      if (currentLevel > unlockedLevels) unlockedLevels = currentLevel;
      currentLevel++;
      if (currentLevel >= LEVELS.length) this._showVictory();
      else this.scene.restart();
    });
  }

  _loseLife() {
    if (this.isDead || this.levelDone) return;
    this.isDead = true;
    SFX.die();
    lives--;
    this._updateHearts();
    this.cameras.main.shake(290, 0.018);
    this.cameras.main.flash(170, 255, 0, 0, false);
    this.ball.setVelocityY(-340);
    this.ball.setVelocityX(Phaser.Math.Between(-160, 160));
    this.time.delayedCall(480, () => {
      if (lives <= 0) { lives = 3; score = Math.max(0, score - 5); this._showGameOver(); }
      else this.scene.restart();
    });
  }

  _onSpike() { this._loseLife(); }

  _onSpring(ball, spring) {
    if (this.isDead || this.levelDone) return;
    if (this.ball.body.velocity.y <= 0) return;
    SFX.spring();
    this.ball.setVelocityY(-720);
    this._burstParticles(spring.x, spring.y - 8, 0x44cc44, 10);
    this.tweens.add({
      targets: spring, scaleY: 0.5, yoyo: true, duration: 100, ease: 'Bounce.easeOut',
      onComplete: () => { spring.setScale(1); }
    });
  }

  _onEnemy(ball, enemy) {
    if (this.isDead || this.levelDone) return;
    const falling = this.ball.body.velocity.y > 70;
    const above   = this.ball.y < enemy.y - 6;
    if (falling && above) {
      SFX.stomp(); score += 3; this._updateScore();
      this.cameras.main.shake(90, 0.007);

      const idxG = this.enemyMeta.findIndex(e => e.spr === enemy);
      if (idxG !== -1) this.enemyMeta.splice(idxG, 1);
      const idxF = this.flyEnemyMeta.findIndex(e => e.spr === enemy);
      if (idxF !== -1) this.flyEnemyMeta.splice(idxF, 1);

      this._burstParticles(enemy.x, enemy.y, 0xff6600, 14);
      this.tweens.add({ targets: enemy, y: enemy.y + 70, alpha: 0, scaleY: 0.15, duration: 280, onComplete: () => enemy.destroy() });
      this.ball.setVelocityY(-400);
    } else {
      this._loseLife();
    }
  }

  _onCoin(ball, coin) {
    SFX.coin(); score++; this._updateScore();
    this._burstParticles(coin.x, coin.y, 0xf1c40f, 10);
    this.tweens.add({ targets: coin, y: coin.y - 28, alpha: 0, duration: 230, onComplete: () => coin.destroy() });
    coin.disableBody(false, false);
  }

  // ----------------------------------------------------------------
  _showGameOver() {
    const ov = this.add.graphics().setDepth(10);
    ov.fillStyle(0x000000, 0.8);
    ov.fillRect(0, 0, 800, 600);

    const cg = this.add.graphics().setDepth(10);
    cg.fillStyle(0x1a1a3a, 0.95);
    cg.fillRoundedRect(200, 130, 400, 340, 24);
    cg.lineStyle(2, 0xcc3333);
    cg.strokeRoundedRect(200, 130, 400, 340, 24);

    this.add.text(400, 175, '💀', { fontSize: '60px' }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 245, 'ИГРА ОКОНЧЕНА', {
      fontSize: '36px', fontFamily: 'Nunito, sans-serif', fontStyle: '900', color: '#e74c3c',
    }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 295, `Монеты: ⭐${score}   Уровень: ${currentLevel + 1}`, {
      fontSize: '18px', fontFamily: 'Nunito, sans-serif', color: '#ccddee'
    }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 325, '(–5 монет за поражение)', {
      fontSize: '13px', fontFamily: 'Nunito, sans-serif', color: '#cc5555'
    }).setOrigin(0.5).setDepth(11);

    const rb = this.add.text(400, 380, '[ Попробовать снова ]', {
      fontSize: '22px', fontFamily: 'Nunito, sans-serif', color: '#2ecc71', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });
    rb.on('pointerover', () => rb.setAlpha(0.7));
    rb.on('pointerout', () => rb.setAlpha(1));
    rb.on('pointerdown', () => { currentLevel = 0; lives = 3; score = 0; this.scene.start('GameScene'); });

    const mb = this.add.text(400, 425, '[ Главное меню ]', {
      fontSize: '18px', fontFamily: 'Nunito, sans-serif', color: '#e74c3c'
    }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });
    mb.on('pointerover', () => mb.setAlpha(0.7));
    mb.on('pointerout', () => mb.setAlpha(1));
    mb.on('pointerdown', () => this.scene.start('MenuScene'));
  }

  _showVictory() {
    if (score > hiBest) hiBest = score;
    SFX.victory();

    const ov = this.add.graphics().setDepth(10);
    ov.fillStyle(0x000000, 0.78);
    ov.fillRect(0, 0, 800, 600);

    const cg = this.add.graphics().setDepth(10);
    cg.fillStyle(0x1a1a3a, 0.95);
    cg.fillRoundedRect(200, 110, 400, 380, 24);
    cg.lineStyle(2, 0xf1c40f);
    cg.strokeRoundedRect(200, 110, 400, 380, 24);

    this.add.text(400, 155, '🏆', { fontSize: '64px' }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 228, 'ПОБЕДА!', {
      fontSize: '48px', fontFamily: 'Nunito, sans-serif', fontStyle: '900', color: '#f1c40f',
    }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 285, `Все ${LEVELS.length} уровней пройдены!`, {
      fontSize: '20px', fontFamily: 'Nunito, sans-serif', color: '#ccddee'
    }).setOrigin(0.5).setDepth(11);
    this.add.text(400, 320, `Монеты: ⭐${score}   Рекорд: ⭐${hiBest}`, {
      fontSize: '18px', fontFamily: 'Nunito, sans-serif', color: '#f1c40f'
    }).setOrigin(0.5).setDepth(11);

    this._burstParticles(400, 200, 0xf1c40f, 30);

    const rb = this.add.text(400, 385, '[ Начать заново ]', {
      fontSize: '24px', fontFamily: 'Nunito, sans-serif', color: '#2ecc71', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });
    rb.on('pointerover', () => rb.setAlpha(0.7));
    rb.on('pointerout', () => rb.setAlpha(1));
    rb.on('pointerdown', () => { currentLevel = 0; lives = 3; score = 0; this.scene.start('GameScene'); });

    const mb = this.add.text(400, 435, '[ Главное меню ]', {
      fontSize: '18px', fontFamily: 'Nunito, sans-serif', color: '#e74c3c'
    }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });
    mb.on('pointerover', () => mb.setAlpha(0.7));
    mb.on('pointerout', () => mb.setAlpha(1));
    mb.on('pointerdown', () => this.scene.start('MenuScene'));
  }
}

      case'confetti':trollConfetti();break;
      case'runaway':trollRunAway();break;
      case'rainbow':trollRainbow();break;
      case'gravity':trollGravity();break;
      case'blur':trollBlur();break;
      case'zoom':trollZoom();break;
      case'ghost':trollGhost();break;
      case'glitch':trollGlitch();break;
      case'snow':trollSnow();break;
      case'bubble':trollBubble();break;
      case'darkout':trollDarkout();break;
      case'cursor':trollCursor();break;
      case'typewriter':trollTypewriter();break;
      case'emojirain':trollEmojiRain();break;
      case'bigtext':trollBigText();break;
      case'upsidetext':trollUpsideText();break;
      case'slowmo':trollSlowMo();break;
      case'scalecrazy':trollScaleCrazy();break;
      case'colorinvert':trollColorInvert();break;
      case'reset':trollReset();break;
    }
  }
  function trollFlip(){document.body.style.transform='rotate(180deg)';document.body.style.transition='transform 1s';setTimeout(function(){document.body.style.transform='';},5000);}
  function trollMatrix(){
    var mc=document.getElementById('troll-matrix');
    mc.style.display='block';
    var mctx=mc.getContext('2d');
    mc.width=window.innerWidth;mc.height=window.innerHeight;
    var cols=Math.floor(mc.width/14);
    var drops=Array(cols).fill(1);
    var chars='アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF';
    clearInterval(_matrixInterval);
    _matrixInterval=setInterval(function(){
      mctx.fillStyle='rgba(0,0,0,0.05)';mctx.fillRect(0,0,mc.width,mc.height);
      mctx.fillStyle='#0f0';mctx.font='14px monospace';
      for(var i=0;i<drops.length;i++){
        var ch=chars[Math.floor(Math.random()*chars.length)];
        mctx.fillText(ch,i*14,drops[i]*14);
        if(drops[i]*14>mc.height&&Math.random()>0.975)drops[i]=0;
        drops[i]++;
      }
    },35);
    setTimeout(function(){clearInterval(_matrixInterval);mc.style.display='none';},8000);
  }
  function trollDisco(){var d=document.getElementById('troll-disco');d.style.display='block';clearTimeout(_discoTimeout);_discoTimeout=setTimeout(function(){d.style.display='none';},5000);}
  function trollVirus(){document.getElementById('troll-virus').style.display='flex';}
  function trollShake(){
    var count=0;
    var int=setInterval(function(){
      document.body.style.transform='translate('+((Math.random()-.5)*30)+'px,'+((Math.random()-.5)*20)+'px)';
      count++;if(count>40){clearInterval(int);document.body.style.transform='';}
    },50);
  }
  function trollConfetti(){
    var colors=['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#6c5ce7','#00b894','#fd79a8'];
    for(var i=0;i<80;i++){(function(){
      var c=document.createElement('div');
      c.className='troll-confetti';
      c.style.left=Math.random()*100+'%';c.style.top='-10px';
      c.style.background=colors[Math.floor(Math.random()*colors.length)];
      c.style.borderRadius=Math.random()>.5?'50%':'0';
      c.style.animationDelay=Math.random()*2+'s';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);setTimeout(function(){c.remove();},5000);
    })();}
  }
  function trollRunAway(){}
  function trollRainbow(){var o=document.getElementById('troll-rainbow-overlay');o.style.display='block';setTimeout(function(){o.style.display='none';},6000);}
  function trollGravity(){}
  function trollBlur(){document.body.style.filter='blur(8px)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},6000);}
  function trollZoom(){
    var t=0;
    var int=setInterval(function(){var s=1+0.06*Math.sin(t*0.3);document.body.style.transform='scale('+s+')';t++;},50);
    setTimeout(function(){clearInterval(int);document.body.style.transform='';},6000);
  }
  function trollGhost(){
    var t=0;
    var int=setInterval(function(){var o=0.5+0.5*Math.sin(t*0.6);document.body.style.opacity=Math.max(0.02,o).toString();t++;},40);
    setTimeout(function(){clearInterval(int);document.body.style.opacity='';},5000);
  }
  function trollGlitch(){
    var ov=document.getElementById('troll-glitch');ov.style.display='block';
    clearInterval(_glitchInterval);
    _glitchInterval=setInterval(function(){
      var bars=[];
      for(var i=0;i<8;i++){
        var y=Math.random()*100,h=Math.random()*6+1,color='hsl('+Math.floor(Math.random()*360)+',100%,50%)',x=(Math.random()-.5)*30;
        bars.push('<div style="position:absolute;top:'+y+'%;left:0;width:100%;height:'+h+'%;background:'+color+';opacity:.55;transform:translateX('+x+'px)"></div>');
      }
      ov.innerHTML=bars.join('');
    },80);
    setTimeout(function(){clearInterval(_glitchInterval);ov.style.display='none';ov.innerHTML='';},5000);
  }
  function trollSnow(){
    var emojis=['❄️','⛄','🌨️'];
    for(var i=0;i<40;i++){(function(){
      var delay=Math.random()*3000;
      setTimeout(function(){
        var el=document.createElement('div');el.className='troll-float';
        el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left=Math.random()*100+'vw';el.style.top='-40px';
        el.style.fontSize=(20+Math.random()*20)+'px';
        el.style.animation='troll-fall '+(3+Math.random()*4)+'s ease-in forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},8000);
      },delay);
    })();}
  }
  function trollBubble(){
    var emojis=['🫧','💫','🎈','✨'];
    for(var i=0;i<35;i++){(function(){
      var delay=Math.random()*2500;
      setTimeout(function(){
        var el=document.createElement('div');el.className='troll-float';
        el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left=Math.random()*100+'vw';el.style.bottom='-40px';el.style.top='auto';
        el.style.fontSize=(18+Math.random()*18)+'px';
        el.style.animation='troll-rise '+(2.5+Math.random()*3)+'s ease-out forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},6500);
      },delay);
    })();}
  }
  function trollDarkout(){
    var ov=document.createElement('div');ov.id='troll-darkout-el';
    ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;pointer-events:none;opacity:0;transition:opacity 1.5s';
    document.body.appendChild(ov);
    requestAnimationFrame(function(){ov.style.opacity='1';});
    setTimeout(function(){ov.style.opacity='0';},2000);
    setTimeout(function(){ov.remove();},3600);
  }
  function trollCursor(){
    var style=document.createElement('style');style.id='troll-cursor-style';
    style.textContent='*{cursor:url("data:image/svg+xml,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'32\' height=\'32\'><text y=\'28\' font-size=\'28\'>💩</text></svg>") 16 16,auto !important}';
    document.head.appendChild(style);
    setTimeout(function(){style.remove();},6000);
  }
  function trollTypewriter(){
    var ov=document.getElementById('troll-typewriter');
    var words=['ACCESSING SYSTEM...','ROOT ACCESS GRANTED','DELETING SYSTEM32...','HACKING MAINFRAME...','BYPASSING FIREWALL...','UPLOADING VIRUS...','STEALING DATA...','ENCRYPTING FILES...','GAME OVER...','YOU HAVE BEEN PWNED'];
    ov.textContent='';ov.style.display='block';
    clearInterval(_typewriterInterval);
    var text='';
    _typewriterInterval=setInterval(function(){
      text+=words[Math.floor(Math.random()*words.length)]+'\n';
      if(text.length>600)text=text.slice(text.length-600);
      ov.textContent=text;
    },120);
    setTimeout(function(){clearInterval(_typewriterInterval);ov.style.display='none';ov.textContent='';},6000);
  }
  function trollEmojiRain(){
    var emojis=['😂','🤣','💀','🔥','👀','😱','🤡','👾','💩','🐛','🎃','👻','🦠','☠️','🤮','😈','👽','🛸','🌝','🍆','🌈','🦄','🐸'];
    for(var i=0;i<60;i++){(function(){
      var delay=Math.random()*2000;
      setTimeout(function(){
        var el=document.createElement('div');el.className='troll-float';
        el.textContent=emojis[Math.floor(Math.random()*emojis.length)];
        el.style.left=Math.random()*100+'vw';el.style.top='-40px';
        el.style.fontSize=(16+Math.random()*24)+'px';
        el.style.animation='troll-fall '+(1.5+Math.random()*3)+'s ease-in forwards';
        document.body.appendChild(el);setTimeout(function(){el.remove();},5500);
      },delay);
    })();}
  }
  function trollBigText(){
    var phrases=['ТЫ ВЗЛОМАН 💀','ВСЁ ПРОПАЛО 😱','УДАЛЯЮ ДАННЫЕ...','ПРОЩАЙ, ДРУГ 👋','СЕРВЕР ВЗЛОМАН','ВИРУС АКТИВИРОВАН ☠️'];
    var ov=document.getElementById('troll-bigtext');var sp=document.getElementById('troll-bigtext-word');
    ov.style.display='flex';var idx=0;sp.textContent=phrases[0];
    clearTimeout(_bigtextTimeout);
    function next(){idx++;if(idx>=phrases.length){ov.style.display='none';return;}sp.textContent=phrases[idx];_bigtextTimeout=setTimeout(next,900);}
    _bigtextTimeout=setTimeout(next,900);
    setTimeout(function(){ov.style.display='none';clearTimeout(_bigtextTimeout);},6000);
  }
  function trollUpsideText(){
    var style=document.createElement('style');style.id='troll-upside-style';
    style.textContent='p,h1,h2,h3,h4,span,a,button,label{transform:rotate(180deg) !important;display:inline-block !important}';
    document.head.appendChild(style);setTimeout(function(){style.remove();},5000);
  }
  function trollSlowMo(){
    document.documentElement.style.animationDuration='500%';document.documentElement.style.transitionDuration='500%';
    setTimeout(function(){document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';},6000);
  }
  function trollScaleCrazy(){
    clearInterval(_scaleCrazyInterval);
    _scaleCrazyInterval=setInterval(function(){
      var cards=document.querySelectorAll('.game-card');if(!cards.length)return;
      var card=cards[Math.floor(Math.random()*cards.length)];
      card.style.transform='scale(1.5)';card.style.zIndex='200';card.style.transition='transform .1s';
      setTimeout(function(){card.style.transform='';card.style.zIndex='';},180);
    },200);
    setTimeout(function(){clearInterval(_scaleCrazyInterval);document.querySelectorAll('.game-card').forEach(function(c){c.style.transform='';c.style.zIndex='';});},5000);
  }
  function trollColorInvert(){document.body.style.filter='invert(1)';document.body.style.transition='filter .3s';setTimeout(function(){document.body.style.filter='';},5000);}
  function trollReset(){
    document.body.style.transform='';document.body.style.filter='';document.body.style.opacity='';
    document.getElementById('troll-matrix').style.display='none';clearInterval(_matrixInterval);
    document.getElementById('troll-virus').style.display='none';
    document.getElementById('troll-disco').style.display='none';clearTimeout(_discoTimeout);
    document.getElementById('troll-rainbow-overlay').style.display='none';
    document.getElementById('troll-glitch').style.display='none';document.getElementById('troll-glitch').innerHTML='';clearInterval(_glitchInterval);
    document.getElementById('troll-typewriter').style.display='none';clearInterval(_typewriterInterval);
    document.getElementById('troll-bigtext').style.display='none';clearTimeout(_bigtextTimeout);
    clearInterval(_scaleCrazyInterval);
    document.querySelectorAll('.troll-confetti,.troll-float').forEach(function(e){e.remove();});
    var de=document.getElementById('troll-darkout-el');if(de)de.remove();
    var cs=document.getElementById('troll-cursor-style');if(cs)cs.remove();
    var us=document.getElementById('troll-upside-style');if(us)us.remove();
    document.documentElement.style.animationDuration='';document.documentElement.style.transitionDuration='';
  }
  if(db){
    db.ref('trolls').on('child_added',function(snap){var data=snap.val();if(data&&data.time>lastTrollTime){executeTroll(data.type);}});
    var _lastBroadcast=Date.now();
    db.ref('broadcast').on('value',function(snap){var data=snap.val();if(!data||data.time<=_lastBroadcast)return;_lastBroadcast=data.time;var b=document.getElementById('troll-broadcast');b.textContent='📢 '+data.text;b.style.display='block';setTimeout(function(){b.style.display='none';},8000);});
    db.ref('theme').on('value',function(snap){var t=snap.val();if(!t)return;if(t==='neon'){document.body.style.background='linear-gradient(135deg,#0a0a1a,#001a33,#0a1a0a)';document.body.style.color='#00ffcc';}else if(t==='retro'){document.body.style.background='linear-gradient(135deg,#2c1810,#4a2c1a,#3a2010)';document.body.style.color='#ffd700';}else{document.body.style.background='';document.body.style.color='';}});
  }
})();
</script>
